<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Lowxxy Animation</title>
  <link rel="manifest" href="./manifest.webmanifest?v=218" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
  <style>
    :root{color-scheme:dark;--paper:#f2f0e8;--gold:#d6aa42;--gold2:#ffe59a;font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:var(--paper)}
    body{background:radial-gradient(circle at 50% 25%,#29251b 0,#111 38%,#050505 78%)}
    body::before{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.18;background-image:radial-gradient(#fff 0 .7px,transparent .9px);background-size:11px 11px;mix-blend-mode:soft-light}
    #stage{position:fixed;inset:0}
    a-scene{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;background:transparent!important}
    .top{position:fixed;z-index:20;top:0;left:0;right:0;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;background:linear-gradient(#070707f2,#070707c9,transparent)}
    .iconBtn{width:48px;height:48px;border:2px solid #d6aa42;border-radius:17px;background:radial-gradient(circle at 50% 20%,#5a4516,#171006 72%);color:#ffe59a;display:grid;place-items:center;box-shadow:0 4px 0 #6e521e,0 7px 0 #000}.iconBtn svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .logo{text-align:center;font-family:Georgia,serif;font-weight:900;letter-spacing:.12em}.logo strong{display:block;font-size:20px}.logo span{font-size:10px;color:#bbb}
    .bottomCard{position:fixed;z-index:20;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(420px,calc(100vw - 28px));padding:14px 16px 13px;border:2px solid #8e6b24;border-radius:20px;background:#080808e8;text-align:center;box-shadow:0 0 22px #d6aa4222,0 12px 30px #000b}
    .kicker{color:#ffe59a;font:900 10px/1 Arial,sans-serif;letter-spacing:.16em}.title{margin:6px 0 3px;font:900 22px/1.05 Georgia,serif;letter-spacing:.05em;text-transform:uppercase}.hint{font-size:11px;color:#aaa}.replay{margin-top:10px;border:1.5px solid #d6aa42;border-radius:999px;background:#171006;color:#ffe59a;padding:8px 13px;font:900 10px/1 Arial,sans-serif;letter-spacing:.1em}
    .film-wipe{position:fixed;inset:0;z-index:999999;pointer-events:none;overflow:hidden;visibility:hidden}.film-wipe.active{visibility:visible}.film-sheet{position:absolute;top:50%;width:245vw;height:46vh;min-height:290px;max-height:430px;display:grid;grid-template-rows:58px 1fr 58px;background:#0a0907;border:3px solid #d9d0b6;box-shadow:0 22px 60px #000d,0 -10px 40px #0009;transform-origin:center;will-change:transform;filter:sepia(.22) contrast(1.1)}.film-sheet.to-right{left:-255vw;animation:filmTapeRight .92s cubic-bezier(.16,.78,.24,1) forwards}.film-sheet.to-left{right:-255vw;animation:filmTapeLeft .92s cubic-bezier(.16,.78,.24,1) forwards}.film-holes{position:relative;background:#090806;border-color:#d9d0b6;border-style:solid;border-width:0}.film-holes:first-child{border-bottom-width:3px}.film-holes:last-child{border-top-width:3px}.film-holes::before{content:"";position:absolute;inset:10px 0;background:repeating-linear-gradient(90deg,transparent 0 18px,#e7dfc8 18px 45px,transparent 45px 72px);opacity:.96}.film-body{position:relative;overflow:hidden;background:#11100d}.film-track{position:absolute;inset:14px 0;display:flex;gap:22px;width:max-content;padding:0 22px;animation:filmFramesRoll .34s linear infinite}.film-frame{width:31vw;min-width:220px;max-width:360px;height:100%;border:5px solid #ded5bc;border-radius:4px;background:radial-gradient(circle at 42% 28%,#4e493d 0,#24211c 34%,#090806 78%)}.film-scratches{position:absolute;inset:0;opacity:.22;background:linear-gradient(90deg,transparent 13%,#fff 13.2%,transparent 13.35% 46%,#fff 46.12%,transparent 46.27% 78%,#fff 78.1%,transparent 78.22%);animation:filmFlicker .14s steps(2,end) infinite}@keyframes filmTapeRight{0%{transform:translateY(-50%) translateX(0) rotate(-7deg)}42%{transform:translateY(-50%) translateX(118vw) rotate(-5deg)}100%{transform:translateY(-50%) translateX(365vw) rotate(-3deg)}}@keyframes filmTapeLeft{0%{transform:translateY(-50%) translateX(0) rotate(7deg)}42%{transform:translateY(-50%) translateX(-118vw) rotate(5deg)}100%{transform:translateY(-50%) translateX(-365vw) rotate(3deg)}}@keyframes filmFramesRoll{from{transform:translateX(0)}to{transform:translateX(-34vw)}}@keyframes filmFlicker{0%,100%{opacity:.18}50%{opacity:.34}}
    @media(max-width:430px){.film-sheet{height:42vh;min-height:260px;grid-template-rows:48px 1fr 48px}.film-frame{width:72vw;min-width:250px}.film-track{gap:16px}.film-holes::before{inset:8px 0;background:repeating-linear-gradient(90deg,transparent 0 13px,#e7dfc8 13px 34px,transparent 34px 55px)}@keyframes filmFramesRoll{from{transform:translateX(0)}to{transform:translateX(-76vw)}}}
  </style>
</head>
<body>
  <div id="stage">
    <a-scene embedded renderer="alpha:true;antialias:true;colorManagement:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
      <a-assets>
        <a-asset-item id="popArtAsset" src="./assets/pop-art.glb?v=218"></a-asset-item>
        <a-asset-item id="groundedAsset" src="./assets/grounded-gains.glb?v=218"></a-asset-item>
        <a-asset-item id="hangAsset" src="./assets/hang-v77.glb?v=218"></a-asset-item>
      </a-assets>
      <a-entity light="type:ambient;intensity:1.9;color:#ffffff"></a-entity>
      <a-entity light="type:directional;intensity:2.2;color:#fff3d1" position="1 3 4"></a-entity>
      <a-entity id="modelRoot" position="0 0 -4"></a-entity>
      <a-camera position="0 0 0" look-controls="enabled:false" wasd-controls="enabled:false"></a-camera>
    </a-scene>
  </div>
  <header class="top">
    <button class="iconBtn" id="backBtn" aria-label="Back to collection"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="logo"><strong>LOWXXY</strong><span>ANIMATION</span></div><div></div>
  </header>
  <div class="bottomCard"><div class="kicker">✦ UNLOCKED AR DESIGN ✦</div><div class="title" id="designTitle">LOWXXY</div><div class="hint">Your unlocked animation is playing.</div><button class="replay" id="replayBtn">REPLAY ANIMATION</button></div>
<script>
const design=new URLSearchParams(location.search).get('design')||'pop-art-chainmail';
const configs={
  'pop-art-chainmail':{title:'Chainmail + Pop Art',asset:'#popArtAsset',scale:'2.9 2.9 2.9',position:'0 -0.65 -4',rotation:'0 180 0'},
  'grounded-gains':{title:'Grounded Gains',asset:'#groundedAsset',scale:'1.15 1.15 1.15',position:'0 -0.7 -4',rotation:'0 180 0'},
  'hang':{title:'Hang',asset:'#hangAsset',scale:'5.2 5.2 5.2',position:'0 -1.45 -5.1',rotation:'0 180 0'}
};
const cfg=configs[design]||configs['pop-art-chainmail'];
document.getElementById('designTitle').textContent=cfg.title;
const root=document.getElementById('modelRoot');
function loadModel(){root.innerHTML='';const el=document.createElement('a-entity');el.setAttribute('gltf-model',cfg.asset);el.setAttribute('animation-mixer','clip:*; loop:repeat; repetitions:Infinity; timeScale:1');el.setAttribute('scale',cfg.scale);el.setAttribute('position',cfg.position);el.setAttribute('rotation',cfg.rotation);root.appendChild(el);}
if(document.querySelector('a-scene').hasLoaded) loadModel(); else document.querySelector('a-scene').addEventListener('loaded',loadModel,{once:true});
document.getElementById('replayBtn').addEventListener('click',loadModel);
function ensureFilmWipe(){let wipe=document.getElementById('lowxxyFilmWipe');if(wipe)return wipe;wipe=document.createElement('div');wipe.id='lowxxyFilmWipe';wipe.className='film-wipe';const frames=Array.from({length:14},()=>'<div class="film-frame"></div>').join('');wipe.innerHTML='<div class="film-sheet"><div class="film-holes"></div><div class="film-body"><div class="film-track">'+frames+'</div><div class="film-scratches"></div></div><div class="film-holes"></div></div>';document.body.appendChild(wipe);return wipe;}
function nav(url,direction='right'){const wipe=ensureFilmWipe(),sheet=wipe.querySelector('.film-sheet');sheet.className='film-sheet '+(direction==='left'?'to-left':'to-right');wipe.classList.remove('active');void wipe.offsetWidth;wipe.classList.add('active');setTimeout(()=>location.href=url,760)}
document.getElementById('backBtn').addEventListener('click',()=>nav('./collection.html?v=218','right'));
</script>
</body>
</html>
