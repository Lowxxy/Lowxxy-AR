  <style>
    :root{color-scheme:dark;--paper:#f2f0e8;--gold:#d6aa42;--gold2:#ffe59a;font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:var(--paper);touch-action:none}
    body{background:radial-gradient(circle at 50% 25%,#29251b 0,#111 38%,#050505 78%)}
    body::before{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.18;background-image:radial-gradient(#fff 0 .7px,transparent .9px);background-size:11px 11px;mix-blend-mode:soft-light}
    #stage{position:fixed;inset:0;touch-action:none}
    #previewCrown{position:absolute;z-index:0;left:50%;top:49%;width:min(82vw,620px);height:auto;transform:translate(-50%,-50%) rotate(-5deg);opacity:.075;filter:drop-shadow(0 0 24px rgba(255,255,255,.08));pointer-events:none;user-select:none}a-scene{z-index:1}
    a-scene{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;background:transparent!important}
    .top{position:fixed;z-index:20;top:0;left:0;right:0;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;background:linear-gradient(#070707f2,#070707c9,transparent)}
    .iconBtn{width:48px;height:48px;border:2px solid #d6aa42;border-radius:17px;background:radial-gradient(circle at 50% 20%,#5a4516,#171006 72%);color:#ffe59a;display:grid;place-items:center;box-shadow:0 4px 0 #6e521e,0 7px 0 #000}.iconBtn svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .logo{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.logo img{display:block;width:132px;max-width:34vw;height:auto;filter:brightness(1.04)}.logo span{font:900 9px/1 Arial,sans-serif;letter-spacing:.22em;color:#bbb}
    .gestureHint{position:fixed;z-index:20;left:50%;top:calc(83px + env(safe-area-inset-top));transform:translateX(-50%);white-space:nowrap;padding:7px 11px;border:1px solid #6f5b2b;border-radius:999px;background:#080808c9;color:#d8cfb9;font:900 9px/1 Arial,sans-serif;letter-spacing:.09em;box-shadow:0 6px 18px #0008;pointer-events:none}
    .bottomCard{position:fixed;z-index:20;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(420px,calc(100vw - 28px));padding:12px 14px 11px;border:2px solid #8e6b24;border-radius:20px;background:#080808e8;text-align:center;box-shadow:0 0 22px #d6aa4222,0 12px 30px #000b}
    .kicker{color:#ffe59a;font:900 9px/1 Arial,sans-serif;letter-spacing:.15em}.title{margin:5px 0 2px;font:900 20px/1.05 Georgia,serif;letter-spacing:.05em;text-transform:uppercase}.hint{font-size:10px;color:#aaa}.controls{display:flex;justify-content:center;gap:8px;margin-top:9px}.replay,.reset{border:1.5px solid #d6aa42;border-radius:999px;background:#171006;color:#ffe59a;padding:8px 12px;font:900 9px/1 Arial,sans-serif;letter-spacing:.09em}.reset{border-color:#555;background:#101010;color:#ddd}
    .film-wipe{position:fixed;inset:0;z-index:999999;pointer-events:none;overflow:hidden;visibility:hidden}.film-wipe.active{visibility:visible}.film-sheet{position:absolute;top:50%;width:340vw;height:46vh;min-height:290px;max-height:430px;display:grid;grid-template-rows:58px 1fr 58px;background:#0a0907;border:3px solid #d9d0b6;box-shadow:0 22px 60px #000d,0 -10px 40px #0009;transform-origin:center;will-change:transform;filter:sepia(.22) contrast(1.1)}.film-sheet.to-right{left:-350vw;animation:filmTapeRight 1.12s cubic-bezier(.16,.78,.24,1) forwards}.film-sheet.to-left{right:-350vw;animation:filmTapeLeft 1.12s cubic-bezier(.16,.78,.24,1) forwards}.film-holes{position:relative;background:#090806;border-color:#d9d0b6;border-style:solid;border-width:0}.film-holes:first-child{border-bottom-width:3px}.film-holes:last-child{border-top-width:3px}.film-holes::before{content:"";position:absolute;inset:10px 0;background:repeating-linear-gradient(90deg,transparent 0 18px,#e7dfc8 18px 45px,transparent 45px 72px);opacity:.96}.film-body{position:relative;overflow:hidden;background:#11100d}.film-track{position:absolute;inset:14px 0;display:flex;gap:22px;width:max-content;padding:0 22px;animation:filmFramesRoll .34s linear infinite}.film-frame{width:31vw;min-width:220px;max-width:360px;height:100%;border:5px solid #ded5bc;border-radius:4px;background:radial-gradient(circle at 42% 28%,#4e493d 0,#24211c 34%,#090806 78%)}.film-scratches{position:absolute;inset:0;opacity:.22;background:linear-gradient(90deg,transparent 13%,#fff 13.2%,transparent 13.35% 46%,#fff 46.12%,transparent 46.27% 78%,#fff 78.1%,transparent 78.22%);animation:filmFlicker .14s steps(2,end) infinite}@keyframes filmTapeRight{0%{transform:translateY(-50%) translateX(0) rotate(-7deg)}50%{transform:translateY(-50%) translateX(180vw) rotate(-5deg)}100%{transform:translateY(-50%) translateX(500vw) rotate(-3deg)}}@keyframes filmTapeLeft{0%{transform:translateY(-50%) translateX(0) rotate(7deg)}50%{transform:translateY(-50%) translateX(-180vw) rotate(5deg)}100%{transform:translateY(-50%) translateX(-500vw) rotate(3deg)}}@keyframes filmFramesRoll{from{transform:translateX(0)}to{transform:translateX(-34vw)}}@keyframes filmFlicker{0%,100%{opacity:.18}50%{opacity:.34}}
    @media(max-width:430px){.film-sheet{height:42vh;min-height:260px;grid-template-rows:48px 1fr 48px}.film-frame{width:72vw;min-width:250px}.film-track{gap:16px}.film-holes::before{inset:8px 0;background:repeating-linear-gradient(90deg,transparent 0 13px,#e7dfc8 13px 34px,transparent 34px 55px)}@keyframes filmFramesRoll{from{transform:translateX(0)}to{transform:translateX(-76vw)}}.gestureHint{top:calc(78px + env(safe-area-inset-top));font-size:8px}.bottomCard{padding:10px 12px}.title{font-size:18px}}
  
  .film-crown{position:absolute;left:50%;top:50%;width:46%;height:auto;transform:translate(-50%,-50%) rotate(-4deg);opacity:.58;filter:sepia(1) saturate(.65) brightness(1.35);z-index:3;pointer-events:none;mix-blend-mode:screen}
  .film-frame:nth-child(even) .film-crown{transform:translate(-50%,-50%) rotate(4deg);opacity:.42}

body::after{content:"";position:fixed;inset:0;z-index:9;pointer-events:none;opacity:.035;mix-blend-mode:screen;background-image:radial-gradient(#fff 0 .5px,transparent .8px),radial-gradient(#000 0 .7px,transparent 1px);background-size:7px 7px,10px 10px;animation:previewGrain .18s steps(2) infinite}@keyframes previewGrain{50%{transform:translate(1px,-1px)}}.logo img,.gestureHint{animation:previewProjector 9s steps(1,end) infinite}@keyframes previewProjector{0%,91%,93%,95%,100%{opacity:1}92%{opacity:.84}94%{opacity:.96}}
</style>
</head>
<body>
<script>
window.LowxxySound=window.LowxxySound||(()=>{let ctx=null;const AC=window.AudioContext||window.webkitAudioContext;function get(){if(!AC)return null;if(!ctx)ctx=new AC();if(ctx.state==='suspended')ctx.resume().catch(()=>{});return ctx}function tone(freq=220,dur=.08,type='triangle',vol=.035,delay=0){const c=get();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.03)}function noise(dur=.12,vol=.03,low=500,high=5000,delay=0){const c=get();if(!c)return;const len=Math.max(1,Math.floor(c.sampleRate*dur)),buf=c.createBuffer(1,len,c.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len*.35);const src=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+delay;src.buffer=buf;bp.type='bandpass';bp.frequency.value=(low+high)/2;bp.Q.value=.55;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(bp).connect(g).connect(c.destination);src.start(t);src.stop(t+dur+.03)}function click(){noise(.055,.02,900,4200);tone(118,.055,'square',.025)}function shutter(){noise(.045,.055,700,6500);tone(105,.045,'square',.04);noise(.07,.04,500,4500,.06);tone(82,.065,'square',.028,.055)}function chime(){tone(523.25,.18,'triangle',.04);tone(659.25,.18,'triangle',.035,.09);tone(783.99,.25,'triangle',.04,.18);noise(.20,.008,1000,6000,.12)}function tape(){const c=get();if(!c)return;const dur=1.08,len=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,len,c.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++){const x=i/len;data[i]=(Math.random()*2-1)*(.55+.45*Math.sin(x*Math.PI));}const src=c.createBufferSource(),hp=c.createBiquadFilter(),lp=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime;src.buffer=buf;hp.type='highpass';hp.frequency.value=380;lp.type='lowpass';lp.frequency.value=5200;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.055,t+.09);g.gain.setValueAtTime(.05,t+dur-.15);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(hp).connect(lp).connect(g).connect(c.destination);src.start(t);src.stop(t+dur+.03);tone(76,dur,'sawtooth',.008)}return{click,shutter,chime,tape};})();
</script>
  <div id="stage">
    <img id="previewCrown" src="./assets/lowxxy-crown.png?v=232" alt="">
    <a-scene embedded renderer="alpha:true;antialias:true;colorManagement:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
      <a-assets>
        <a-asset-item id="popArtAsset" src="./assets/pop-art.glb?v=232"></a-asset-item>
        <a-asset-item id="groundedAsset" src="./assets/grounded-gains.glb?v=232"></a-asset-item>
        <a-asset-item id="hangAsset" src="./assets/hang-v77.glb?v=232"></a-asset-item>
      </a-assets>
      <a-entity light="type:ambient;intensity:1.9;color:#ffffff"></a-entity>
      <a-entity light="type:directional;intensity:2.2;color:#fff3d1" position="1 3 4"></a-entity>
      <a-entity id="previewAnchor" position="0 0 -4"><a-entity id="gestureRoot"><a-entity id="modelRoot"></a-entity></a-entity></a-entity>
      <a-camera position="0 0 0" fov="80" look-controls="enabled:false" wasd-controls="enabled:false"></a-camera>
    </a-scene>
  </div>
  <header class="top"><button class="iconBtn" id="backBtn" aria-label="Back to collection"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="logo"><img src="./assets/lowxxy-wordmark.png?v=232" alt="LOWXXY"><span>ANIMATION</span></div><div></div></header>
  <div class="gestureHint">DRAG TO LOOK AROUND • PINCH TO SIZE</div>
  <div class="bottomCard"><div class="kicker">✦ UNLOCKED AR DESIGN ✦</div><div class="title" id="designTitle">LOWXXY</div><div class="hint">Same animation and presentation as the shirt scan.</div><div class="controls"><button class="reset" id="resetViewBtn">RESET VIEW</button><button class="replay" id="replayBtn">REPLAY</button></div></div>
<script>
const design=new URLSearchParams(location.search).get('design')||'pop-art-chainmail';
const configs={
  'pop-art-chainmail':{title:'Chainmail + Pop Art',asset:'#popArtAsset',wrapperPosition:'0 -0.08 0.07',modelPosition:'0.18 -0.238 0',modelRotation:'0 0 0',modelScale:'5.25 5.25 5.25',anchorZ:-4},
  'grounded-gains':{title:'Grounded Gains',asset:'#groundedAsset',wrapperPosition:'0 -0.12 0.08',modelPosition:'0 -0.28 0',modelRotation:'0 0 0',modelScale:'1.25 1.25 1.25',anchorZ:-4},
  'hang':{title:'Hang',asset:'#hangAsset',wrapperPosition:'0 -0.03 0.08',modelPosition:'0 -0.68 -0.013',modelRotation:'0 0 0',modelScale:'7 7 7',anchorZ:-4}
};
const cfg=configs[design]||configs['pop-art-chainmail'];
document.getElementById('designTitle').textContent=cfg.title;
const root=document.getElementById('modelRoot'),gestureRoot=document.getElementById('gestureRoot'),previewAnchor=document.getElementById('previewAnchor');
previewAnchor.setAttribute('position',`0 0 ${cfg.anchorZ}`);
function loadModel(){root.innerHTML='';const wrapper=document.createElement('a-entity');wrapper.setAttribute('position',cfg.wrapperPosition);const el=document.createElement('a-entity');el.setAttribute('gltf-model',cfg.asset);el.setAttribute('animation-mixer','clip:*; loop:repeat; repetitions:Infinity; timeScale:1');el.setAttribute('position',cfg.modelPosition);el.setAttribute('rotation',cfg.modelRotation);el.setAttribute('scale',cfg.modelScale);wrapper.appendChild(el);root.appendChild(wrapper)}
let viewerScale=1,rotX=0,rotY=0;
function resetView(){gestureRoot.setAttribute('rotation','0 0 0');gestureRoot.setAttribute('scale','1 1 1');viewerScale=1;rotX=0;rotY=0}
const scene=document.querySelector('a-scene');if(scene.hasLoaded)loadModel();else scene.addEventListener('loaded',loadModel,{once:true});
document.getElementById('replayBtn').addEventListener('click',()=>{LowxxySound.click();loadModel();});document.getElementById('resetViewBtn').addEventListener('click',()=>{LowxxySound.click();resetView();});
let activePointers=new Map(),lastSingle=null,lastPinchDistance=null;
function pointerDistance(){const pts=[...activePointers.values()];if(pts.length<2)return null;return Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)}
function applyView(){rotX=Math.max(-55,Math.min(55,rotX));gestureRoot.setAttribute('rotation',`${rotX} ${rotY} 0`);gestureRoot.setAttribute('scale',`${viewerScale} ${viewerScale} ${viewerScale}`)}
const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',e=>{activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});try{stage.setPointerCapture(e.pointerId)}catch(_){}if(activePointers.size===1)lastSingle={x:e.clientX,y:e.clientY};if(activePointers.size===2)lastPinchDistance=pointerDistance()});
stage.addEventListener('pointermove',e=>{if(!activePointers.has(e.pointerId))return;e.preventDefault();activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===1&&lastSingle){rotY+=(e.clientX-lastSingle.x)*.45;rotX-=(e.clientY-lastSingle.y)*.32;lastSingle={x:e.clientX,y:e.clientY};applyView()}else if(activePointers.size===2){const d=pointerDistance();if(d&&lastPinchDistance){viewerScale*=d/lastPinchDistance;viewerScale=Math.max(.55,Math.min(2.2,viewerScale));applyView()}lastPinchDistance=d}},{passive:false});
function endPointer(e){activePointers.delete(e.pointerId);if(activePointers.size===1){const p=[...activePointers.values()][0];lastSingle={x:p.x,y:p.y};lastPinchDistance=null}else{lastSingle=null;lastPinchDistance=null}}
stage.addEventListener('pointerup',endPointer);stage.addEventListener('pointercancel',endPointer);
function ensureFilmWipe(){let wipe=document.getElementById('lowxxyFilmWipe');if(wipe)return wipe;wipe=document.createElement('div');wipe.id='lowxxyFilmWipe';wipe.className='film-wipe';const frames=Array.from({length:22},(_,i)=>'<div class="film-frame">'+((i%4===1)?'<img class="film-crown" src="./assets/lowxxy-crown.png?v=232" alt="">':'')+'</div>').join('');wipe.innerHTML='<div class="film-sheet"><div class="film-holes"></div><div class="film-body"><div class="film-track">'+frames+'</div><div class="film-scratches"></div></div><div class="film-holes"></div></div>';document.body.appendChild(wipe);return wipe}
function nav(url,direction='right'){LowxxySound.tape();const wipe=ensureFilmWipe(),sheet=wipe.querySelector('.film-sheet');sheet.className='film-sheet '+(direction==='left'?'to-left':'to-right');wipe.classList.remove('active');void wipe.offsetWidth;wipe.classList.add('active');setTimeout(()=>location.href=url,980)}
document.getElementById('backBtn').addEventListener('click',()=>nav('./collection.html?v=232','right'));
</script>
</body>
