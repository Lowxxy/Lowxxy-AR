  <script>
    AFRAME.registerComponent('face-camera-upright', {
      schema: { smoothing: { default: 0.22 } },
      init() {
        this.worldPosition = new THREE.Vector3();
        this.cameraPosition = new THREE.Vector3();
        this.up = new THREE.Vector3(0, 1, 0);
        this.lookMatrix = new THREE.Matrix4();
        this.worldQuaternion = new THREE.Quaternion();
        this.parentQuaternion = new THREE.Quaternion();
        this.localQuaternion = new THREE.Quaternion();
      },
      tick() {
        const object = this.el.object3D;
        const camera = this.el.sceneEl.camera;
        if (!camera || !object.visible) return;

        object.getWorldPosition(this.worldPosition);
        camera.getWorldPosition(this.cameraPosition);

        // Keep the model upright. Only turn left/right toward the audience,
        // preventing diagonal or downward-facing scans.
        this.cameraPosition.y = this.worldPosition.y;
        if (this.cameraPosition.distanceToSquared(this.worldPosition) < 0.000001) return;

        this.lookMatrix.lookAt(this.worldPosition, this.cameraPosition, this.up);
        this.worldQuaternion.setFromRotationMatrix(this.lookMatrix);

        if (object.parent) {
          object.parent.getWorldQuaternion(this.parentQuaternion).invert();
          this.localQuaternion.copy(this.parentQuaternion).multiply(this.worldQuaternion);
        } else {
          this.localQuaternion.copy(this.worldQuaternion);
        }

        object.quaternion.slerp(this.localQuaternion, this.data.smoothing);
      }
    });
  </script>

  /* v217 — oversized horizontal vintage film strip */
  .film-wipe{position:fixed;inset:0;z-index:999999;pointer-events:none;overflow:hidden;visibility:hidden;background:transparent}
  .film-wipe.active{visibility:visible}
  .film-sheet{position:absolute;top:50%;width:340vw;height:46vh;min-height:290px;max-height:430px;display:grid;grid-template-rows:58px 1fr 58px;background:#0a0907;border:3px solid #d9d0b6;box-shadow:0 22px 60px #000d,0 -10px 40px #0009;transform-origin:center;will-change:transform;filter:sepia(.22) contrast(1.1)}
  .film-sheet.to-right{left:-350vw;animation:filmTapeRight 1.12s cubic-bezier(.16,.78,.24,1) forwards}
  .film-sheet.to-left{right:-350vw;animation:filmTapeLeft 1.12s cubic-bezier(.16,.78,.24,1) forwards}
  .film-holes{position:relative;background:#090806;border-color:#d9d0b6;border-style:solid;border-width:0}
  .film-holes:first-child{border-bottom-width:3px}.film-holes:last-child{border-top-width:3px}
  .film-holes::before{content:"";position:absolute;inset:10px 0;background:repeating-linear-gradient(90deg,transparent 0 18px,#e7dfc8 18px 45px,transparent 45px 72px);opacity:.96}
  .film-body{position:relative;overflow:hidden;background:#11100d}
  .film-track{position:absolute;inset:14px 0;display:flex;gap:22px;width:max-content;padding:0 22px;animation:filmFramesRoll .34s linear infinite;will-change:transform}
  .film-frame{width:31vw;min-width:220px;max-width:360px;height:100%;position:relative;border:5px solid #ded5bc;border-radius:4px;background:radial-gradient(circle at 42% 28%,#4e493d 0,#24211c 34%,#090806 78%);box-shadow:inset 0 0 34px #000,0 0 0 1px #000;overflow:hidden}
  .film-frame:nth-child(3n+2){background:radial-gradient(circle at 65% 38%,#5f5848 0,#28241d 32%,#080705 80%)}
  .film-frame:nth-child(3n){background:radial-gradient(circle at 30% 65%,#4a4539 0,#211e19 37%,#070605 82%)}
  .film-frame::before{content:"";position:absolute;inset:0;background:linear-gradient(108deg,transparent 0 37%,rgba(255,245,215,.13) 40%,transparent 45%),radial-gradient(circle at 18% 22%,rgba(255,255,255,.12),transparent 10%),radial-gradient(circle at 76% 63%,rgba(255,255,255,.08),transparent 12%);mix-blend-mode:screen}
  .film-frame::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 7px,rgba(255,255,255,.018) 8px,transparent 9px);opacity:.8}
  .film-scratches{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.22;background:linear-gradient(90deg,transparent 13%,#fff 13.2%,transparent 13.35% 46%,#fff 46.12%,transparent 46.27% 78%,#fff 78.1%,transparent 78.22%);animation:filmFlicker .14s steps(2,end) infinite}
  @keyframes filmTapeRight{0%{transform:translateY(-50%) translateX(0) rotate(-7deg)}50%{transform:translateY(-50%) translateX(180vw) rotate(-5deg)}100%{transform:translateY(-50%) translateX(500vw) rotate(-3deg)}}

currentTime;src.buffer=buf;hp.type='highpass';hp.frequency.value=380;lp.type='lowpass';lp.frequency.value=5200;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.055,t+.09);g.gain.setValueAtTime(.05,t+dur-.15);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(hp).connect(lp).connect(g).connect(c.destination);src.start(t);src.stop(t+dur+.03);tone(76,dur,'sawtooth',.008)}return{click,shutter,chime,tape};})();

<script>
window.addEventListener('DOMContentLoaded', () => {
  const scene = document.querySelector('a-scene');
  const startOverlay = document.querySelector('#startOverlay');
  const startButton = document.querySelector('#startButton');
  const installButton = document.querySelector('#installButton');
  const installHelp = document.querySelector('#installHelp');
  const statusBar = document.querySelector('#statusBar');
  const scanFrame = document.querySelector('#scanFrame');
  const irisWipe = document.querySelector('#irisWipe');
  const irisHole = document.querySelector('#irisHole');
  const introCrownLogo = document.querySelector('.projector-window .brand-logo');
  const IRIS_OPEN_MS = 3100;
  const IRIS_CLOSE_MS = 2250;

  function filmTransitionTo(url,direction='right'){ lowxxyFilmNavigate(url,direction); }

  const positionIrisOnCrown = () => {
    if (!irisWipe || !introCrownLogo) return;
    const r = introCrownLogo.getBoundingClientRect();
    irisWipe.style.setProperty('--iris-x', `${r.left + r.width * .5}px`);
    irisWipe.style.setProperty('--iris-y', `${r.top + r.height * .28}px`);
  };
  const playIrisOpen = () => {
    if (!irisWipe) return;
    positionIrisOnCrown();
    irisWipe.className = 'active opening';
    irisWipe.style.animation = 'none'; void irisWipe.offsetWidth; irisWipe.style.animation = '';
    setTimeout(() => { irisWipe.className = ''; startOverlay.classList.add('ready'); }, IRIS_OPEN_MS + 120);
  };
  const playIrisClose = () => new Promise(resolve => {
    if (!irisWipe) return resolve();
    positionIrisOnCrown();
    irisWipe.className = 'active closing';
    irisWipe.style.animation = 'none'; void irisWipe.offsetWidth; irisWipe.style.animation = '';
    setTimeout(resolve, IRIS_CLOSE_MS + 80);
  });
    
  const shopBar = document.querySelector('#shopBar');
  const shopButton = document.querySelector('#shopButton');
  const errorText = document.querySelector('#errorText');
  const targets = [...document.querySelectorAll('.ar-target')];
  const cameraTools = document.querySelector('#cameraTools');
  const collectionButton = document.querySelector('#collectionButton');
  const openSelfie = document.querySelector('#openSelfie');
  const takeScannerPhoto = document.querySelector('#takeScannerPhoto');
  const captureToast = document.querySelector('#captureToast');
  const unlockBurst = document.querySelector('#unlockBurst');
  const unlockName = document.querySelector('#unlockName');
  const crownEasterToast = document.querySelector('#crownEasterToast');
  const crownRain = document.querySelector('#crownRain');
  const scanCrown = document.querySelector('.scan-crown-watermark');

  let crownRainHideTimer = null;
  let crownRainClearTimer = null;
  const playCrownRain = (mode='big') => {
    if (!crownRain) return;
    clearTimeout(crownRainHideTimer);
    clearTimeout(crownRainClearTimer);
    crownRain.innerHTML = '';
    crownRain.className = mode === 'big' ? 'show big' : 'show';
    const count = mode === 'big' ? 34 : 15;
    const maxDelay = mode === 'big' ? 0.85 : 0.45;
    for (let i = 0; i < count; i++) {
      const crown = document.createElement('img');
      crown.className = 'crown-drop';
      crown.src = './assets/lowxxy-crown.png?v=239';
      crown.alt = '';
      crown.style.left = `${Math.random() * 100}vw`;
      crown.style.width = `${(mode === 'big' ? 25 : 20) + Math.random() * (mode === 'big' ? 34 : 22)}px`;
      crown.style.setProperty('--delay', `${(Math.random() * maxDelay).toFixed(2)}s`);
      crown.style.setProperty('--dur', `${(mode === 'big' ? 2.5 : 2.0) + Math.random() * (mode === 'big' ? 1.4 : .8)}s`);
      crown.style.setProperty('--drift', `${Math.round((Math.random() * 2 - 1) * (mode === 'big' ? 100 : 65))}px`);
      crown.style.setProperty('--spin', `${Math.round((Math.random() * 2 - 1) * 540)}deg`);
      crown.style.setProperty('--scale', `${(0.72 + Math.random() * 0.55).toFixed(2)}`);
      crownRain.appendChild(crown);
    }
    const hideAt = mode === 'big' ? 3450 : 2450;
    crownRainHideTimer = setTimeout(() => crownRain.classList.remove('show'), hideAt);
    crownRainClearTimer = setTimeout(() => { crownRain.innerHTML = ''; crownRain.className=''; }, hideAt + 950);
  };

  let arSystem = null;
  let deferredInstallPrompt = null;
  let loadedModels = 0;

  const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isAndroid = /android/i.test(navigator.userAgent);
  if (isStandalone) installButton.classList.add('hidden');

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;
    installButton.classList.remove('hidden');
  });

  installButton.addEventListener('click', async () => {
    installHelp.style.display = 'block';
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      return;
    }
    installHelp.textContent = isIOS
      ? 'In Safari, tap Share, then Add to Home Screen, then Add.'
      : isAndroid
      ? 'Use Chrome’s three-dot menu and choose Install app or Add to Home screen.'
      : 'Use your browser’s install option.';
  });

  shopButton.addEventListener('click', () => { filmTransitionTo('https://lowxxy.myshopify.com'); });
  scene.addEventListener('loaded', () => { arSystem = scene.systems['mindar-image-system']; });

  document.querySelectorAll('.ar-model').forEach(model => {
    model.addEventListener('model-loaded', () => {
      loadedModels += 1;

      // Animated skinned meshes can otherwise disappear when a moving limb
      // leaves the mesh's original static bounding box. Keep every model part
      // renderable for the full animation and show both sides of thin geometry.
      const modelObject = model.getObject3D('mesh');
      if (modelObject) {
        modelObject.traverse(node => {
          if (node.isMesh || node.isSkinnedMesh) {
            node.frustumCulled = false;
            const materials = Array.isArray(node.material) ? node.material : [node.material];
            materials.filter(Boolean).forEach(material => {
              material.side = THREE.DoubleSide;
              material.needsUpdate = true;
            });
          }
        });
      }

      const clips = modelObject?.animations || [];
      model._animationDuration = clips.length
        ? Math.max(...clips.map(clip => clip.duration || 0))
        : 5;

      console.log('Loaded AR model', loadedModels, 'of 4', 'duration:', model._animationDuration);
    });
    model.addEventListener('model-error', event => {
      console.error('Model error', event);
      errorText.style.display = 'block';
      errorText.textContent = 'One of the 3D animations could not load. Confirm all four GLB files are inside the assets folder.';
    });
  });

  const restartAnimation = model => {
    const mixer = model.components['animation-mixer'];
    if (mixer && mixer.mixer) {
      mixer.mixer.stopAllAction();
      mixer.mixer.setTime(0);
      model.removeAttribute('animation-mixer');
      requestAnimationFrame(() => model.setAttribute('animation-mixer', 'clip:*; loop:repeat; repetitions:Infinity; timeScale:1'));
    }
  };

  // Smooth-release behavior:
  // - models stay upright and camera-facing while anchored to the design
  // - brief tracking wobble is smoothed by MindAR's filter
  // - when the design leaves frame, the current loop finishes once
  // - the model then hides automatically so the next design can be scanned
  const collectionKeyByTargetName = {
    'POP ART': 'pop-art',
    'GROUNDED GAINS': 'grounded-gains',
    'HANG': 'hang',
    'CHAINMAIL': 'chainmail'
  };
  const unlockScannedShirt = name => {
    const key = collectionKeyByTargetName[name];
    if (!key) return {isNew:false, animationKey:null};
    const animationKey = (key === 'pop-art' || key === 'chainmail') ? 'pop-art-chainmail' : key;
    const alreadyUnlocked = animationKey === 'pop-art-chainmail'
      ? (localStorage.getItem('lowxxy-collection-pop-art') === 'unlocked' || localStorage.getItem('lowxxy-collection-chainmail') === 'unlocked' || localStorage.getItem('lowxxy-collection-pop-art-chainmail') === 'unlocked')
      : localStorage.getItem('lowxxy-collection-' + key) === 'unlocked';
    if (animationKey === 'pop-art-chainmail') {
      localStorage.setItem('lowxxy-collection-pop-art', 'unlocked');
      localStorage.setItem('lowxxy-collection-chainmail', 'unlocked');
      localStorage.setItem('lowxxy-collection-pop-art-chainmail', 'unlocked');
    } else {
      localStorage.setItem('lowxxy-collection-' + key, 'unlocked');
    }
    if (!alreadyUnlocked) localStorage.setItem('lowxxy-new-' + animationKey, '1');
    return {isNew:!alreadyUnlocked, animationKey};
  };
  const showUnlockCelebration = name => {
    unlockName.textContent = name === 'POP ART' || name === 'CHAINMAIL' ? 'CHAINMAIL + POP ART' : name;
    LowxxySound.chime();
    unlockBurst.classList.remove('show'); void unlockBurst.offsetWidth; unlockBurst.classList.add('show');
    setTimeout(()=>unlockBurst.classList.remove('show'),1500);
  };
  let crownTapCount=0,crownTapTimer=null;
  scanCrown?.addEventListener('click',()=>{LowxxySound.click();crownTapCount++;clearTimeout(crownTapTimer);crownTapTimer=setTimeout(()=>crownTapCount=0,1600);if(crownTapCount>=5){crownTapCount=0;crownEasterToast.classList.add('show');playCrownRain('big');LowxxySound.chime();setTimeout(()=>crownEasterToast.classList.remove('show'),2500);}});

  targets.forEach(target => {
    const wrapper = target.querySelector('.model-wrapper');
    const model = target.querySelector('.ar-model');
    const name = target.dataset.name;
    let finishTimer = null;
    let isActive = false;

    const releaseTarget = () => {
      if (finishTimer) clearTimeout(finishTimer);
      finishTimer = null;
      target._finishTimer = null;
      wrapper.setAttribute('visible', false);
      wrapper.removeAttribute('animation__popout');
      isActive = false;
      target._stickyActive = false;
      statusBar.textContent = 'Looking for another Lowxxy design...';
    };

    target.addEventListener('targetFound', () => {
      if (finishTimer) {
        clearTimeout(finishTimer);
        finishTimer = null;
        target._finishTimer = null;
      }

      targets.forEach(other => {
        if (other !== target) {
          if (other._finishTimer) clearTimeout(other._finishTimer);
          other._finishTimer = null;
          other._stickyActive = false;
          other.querySelector('.model-wrapper').setAttribute('visible', false);
        }
      });

      if (!isActive) {
        restartAnimation(model);
        wrapper.removeAttribute('animation__popout');
        wrapper.setAttribute('visible', true);
        wrapper.setAttribute('scale', '0.78 0.78 0.78');
        requestAnimationFrame(() => {
          wrapper.setAttribute('animation__popout', 'property: scale; from: 0.78 0.78 0.78; to: 1 1 1; dur: 650; easing: easeOutBack');
        });
      } else {
        wrapper.setAttribute('visible', true);
      }

      isActive = true;
      target._stickyActive = true;
      const unlockResult = unlockScannedShirt(name);
      if (unlockResult?.isNew) { showUnlockCelebration(name); playCrownRain('small'); }
      statusBar.textContent = unlockResult?.isNew ? 'NEW LOWXXY ANIMATION FOUND!' : 'LOWXXY DESIGN SCANNED — ALREADY COLLECTED';
      statusBar.classList.remove('scan-pop');
      void statusBar.offsetWidth;
      statusBar.classList.add('scan-pop');
    });

    target.addEventListener('targetLost', () => {
      if (!isActive) return;
      if (finishTimer) clearTimeout(finishTimer);

      const durationSeconds = Math.max(0.8, model._animationDuration || 5);
      const mixerComponent = model.components['animation-mixer'];
      const mixerTime = mixerComponent?.mixer?.time || 0;
      let remainingSeconds = durationSeconds - (mixerTime % durationSeconds);

      // Avoid an almost-instant cutoff when tracking is lost right at the end.
      if (remainingSeconds < 0.65) remainingSeconds += durationSeconds;

      statusBar.textContent = 'THE CARTOON IS FINISHING...';
      finishTimer = setTimeout(releaseTarget, remainingSeconds * 1000);
      target._finishTimer = finishTimer;
    });
  });

  startButton.addEventListener('click', async () => {
    sessionStorage.setItem('lowxxy-session-started','1');
    startButton.classList.remove('rubberTap'); void startButton.offsetWidth; startButton.classList.add('rubberTap');
    LowxxySound.click();
    LowxxySound.tape();
    startButton.disabled = true;
    startOverlay.classList.remove('ready');
    startButton.textContent = 'WARMING UP THE PROJECTOR...';
    errorText.style.display = 'none';
    if (!arSystem) arSystem = scene.systems['mindar-image-system'];
    if (!arSystem) {
      errorText.style.display = 'block';
      errorText.textContent = 'The AR engine did not load. Refresh and try again.';
      startButton.disabled = false;
      startButton.textContent = 'RUN IT BACK';
      return;
    }
    await new Promise(r => setTimeout(r, 330));
    await playIrisClose();
    startOverlay.classList.add('hidden');
    statusBar.classList.remove('hidden');
    shopBar.classList.remove('hidden');
    cameraTools.classList.remove('hidden');
    scanFrame.classList.remove('hidden');
    try {
      await arSystem.start();
      irisWipe.className = '';
    } catch (error) {
      console.error(error);
      irisWipe.className = '';
      startOverlay.classList.remove('hidden');
      statusBar.classList.add('hidden');
      shopBar.classList.add('hidden');
      cameraTools.classList.add('hidden');
      scanFrame.classList.add('hidden');
      errorText.style.display = 'block';
      errorText.textContent = 'Camera or scanner could not start. Allow camera access, confirm targets.mind was uploaded, then refresh.';
      startButton.disabled = false;
      startButton.textContent = 'RUN IT BACK';
    }
  });

  const shouldResumeAR = sessionStorage.getItem('lowxxy-resume-ar') === '1' || sessionStorage.getItem('lowxxy-session-started') === '1';
  if (!shouldResumeAR) requestAnimationFrame(() => requestAnimationFrame(playIrisOpen));

  // Once START THE SHOW has been used in this app session, any return to index
  // goes straight back to the scanner. The title/iris screen only returns after
  // the app/session is reopened.
  if (shouldResumeAR) {
    sessionStorage.removeItem('lowxxy-resume-ar');
    const resumeScanner = async () => {
      if (!arSystem) arSystem = scene.systems['mindar-image-system'];
      if (!arSystem) return;
      irisWipe.className = '';
      startOverlay.classList.add('hidden');
      statusBar.classList.remove('hidden');
      shopBar.classList.remove('hidden');
      cameraTools.classList.remove('hidden');
      scanFrame.classList.remove('hidden');
      try { await arSystem.start(); }
      catch (error) {
        console.error(error);
        errorText.style.display = 'block';
        errorText.textContent = 'Camera or scanner could not start. Allow camera access, then refresh.';
      }
    };
    if (scene.hasLoaded) setTimeout(resumeScanner, 180);
    else scene.addEventListener('loaded', () => setTimeout(resumeScanner, 180), { once:true });
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const registration = await navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' });
        registration.update().catch(() => {});
      } catch (err) { console.warn('SW registration failed', err); }
    });
  }

  collectionButton.addEventListener('click', () => {
    sessionStorage.setItem('lowxxy-return-url', location.href);
    sessionStorage.setItem('lowxxy-session-started','1');
    sessionStorage.setItem('lowxxy-resume-ar','1');
    filmTransitionTo('./collection.html?v=239','left');
  });

  openSelfie.addEventListener('click', () => {
    sessionStorage.setItem('lowxxy-return-url', location.href);
    sessionStorage.setItem('lowxxy-session-started','1');
    sessionStorage.setItem('lowxxy-resume-ar','1');
    filmTransitionTo('./selfie.html?v=239','right');
  });

  function drawCover(ctx, source, width, height, mirror = false) {
    const sw = source.videoWidth || source.width;
    const sh = source.videoHeight || source.height;
    if (!sw || !sh) return false;
    const scale = Math.max(width / sw, height / sh);
    const dw = sw * scale;
    const dh = sh * scale;
    const dx = (width - dw) / 2;
    const dy = (height - dh) / 2;
    ctx.save();
    if (mirror) {
      ctx.translate(width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(source, dx, dy, dw, dh);
    ctx.restore();
    return true;
  }

  function showCaptureToast(message) {
    captureToast.textContent = message;
    captureToast.classList.add('show');
    setTimeout(() => captureToast.classList.remove('show'), 1300);
  }

  async function shareOrDownload(blob, filename) {
    const file = new File([blob], filename, { type: 'image/png' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Lowxxy AR Photo' }); return; }
      catch (error) { if (error.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  takeScannerPhoto.addEventListener('click', async () => {
    LowxxySound.shutter();
    takeScannerPhoto.disabled = true;
    try {
      const cameraVideo = [...document.querySelectorAll('video')].find(video => video.readyState >= 2 && video.videoWidth > 0);
      const arCanvas = scene.canvas || scene.renderer?.domElement || scene.querySelector('canvas');
      if (!cameraVideo || !arCanvas) throw new Error('Camera or AR canvas is not ready');
      const width = cameraVideo.videoWidth || 1280;
      const height = cameraVideo.videoHeight || 720;
      if (scene.renderer) scene.renderer.render(scene.object3D, scene.camera);
      const output = document.createElement('canvas');
      output.width = width;
      output.height = height;
      const ctx = output.getContext('2d');
      drawCover(ctx, cameraVideo, width, height, false);
      ctx.drawImage(arCanvas, 0, 0, width, height);
      ctx.fillStyle = 'rgba(0,0,0,.72)';
      ctx.fillRect(0, height - Math.max(64, height * .08), width, Math.max(64, height * .08));
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = `900 ${Math.max(26, width * .035)}px Arial`;
      ctx.fillText('@LOWXXY.BRAND', width / 2, height - Math.max(22, height * .027));
      const blob = await new Promise(resolve => output.toBlob(resolve, 'image/png', .96));
      if (!blob) throw new Error('Photo could not be created');
      showCaptureToast('PHOTO READY!');
      await shareOrDownload(blob, `lowxxy-ar-${Date.now()}.png`);
    } catch (error) {
      console.error(error);
      showCaptureToast('PHOTO FAILED — TRY AGAIN');
    } finally {
      takeScannerPhoto.disabled = false;
    }
  });

});
</script>


<script>
(function(){
  function ensureFilmWipe(){
    let wipe=document.getElementById('lowxxyFilmWipe');
    if(wipe) return wipe;
    wipe=document.createElement('div');
    wipe.id='lowxxyFilmWipe';
    wipe.className='film-wipe';
    const frames=Array.from({length:22},()=>'<div class="film-frame"><img class="film-crown" src="./assets/lowxxy-crown.png?v=239" alt=""></div>').join('');
    wipe.innerHTML='<div class="film-sheet"><div class="film-holes"></div><div class="film-body"><div class="film-track">'+frames+'</div><div class="film-scratches"></div></div><div class="film-holes"></div></div>';
    document.body.appendChild(wipe);
    return wipe;
  }
  window.lowxxyFilmNavigate=function(url,direction){
    LowxxySound.tape();
    const wipe=ensureFilmWipe();
    const sheet=wipe.querySelector('.film-sheet');
    sheet.className='film-sheet '+(direction==='left'?'to-left':'to-right');
    wipe.classList.remove('active');
    void wipe.offsetWidth;
    wipe.classList.add('active');
    setTimeout(()=>{location.href=url;},980);
  };
})();
</script>
