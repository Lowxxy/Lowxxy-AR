<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Lowxxy AR</title>
  <link rel="manifest" href="./manifest.webmanifest?v=122" />
  <link rel="apple-touch-icon" href="./icons/lowxxy-character-192.png?v=122" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
  <script>
    AFRAME.registerComponent('face-camera-upright', {
      schema: { smoothing: { default: 0.22 } },
      init() {
        this.worldPosition = new THREE.Vector3();
        this.cameraPosition = new THREE.Vector3();
        this.up = new THREE.Vector3(0, 1, 0);
        this.lookMatrix = new THREE.Matrix4();
        this.worldQuaternion = new THREE.Quaternion();
        this.parentQuaternion = new THREE.Quaternion();
        this.localQuaternion = new THREE.Quaternion();
      },
      tick() {
        const object = this.el.object3D;
        const camera = this.el.sceneEl.camera;
        if (!camera || !object.visible) return;

        object.getWorldPosition(this.worldPosition);
        camera.getWorldPosition(this.cameraPosition);

        // Keep the model upright. Only turn left/right toward the audience,
        // preventing diagonal or downward-facing scans.
        this.cameraPosition.y = this.worldPosition.y;
        if (this.cameraPosition.distanceToSquared(this.worldPosition) < 0.000001) return;

        this.lookMatrix.lookAt(this.worldPosition, this.cameraPosition, this.up);
        this.worldQuaternion.setFromRotationMatrix(this.lookMatrix);

        if (object.parent) {
          object.parent.getWorldQuaternion(this.parentQuaternion).invert();
          this.localQuaternion.copy(this.parentQuaternion).multiply(this.worldQuaternion);
        } else {
          this.localQuaternion.copy(this.worldQuaternion);
        }

        object.quaternion.slerp(this.localQuaternion, this.data.smoothing);
      }
    });
  </script>
  <style>
    :root{
      color-scheme:dark;
      --black:#050505;
      --ink:#111;
      --gray:#777;
      --silver:#d7d7d7;
      --paper:#f2f0e8;
      --white:#fff;
      font-family:"Cooper Black","Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    #app,a-scene{position:fixed;inset:0;width:100%;height:100%}
    .hidden{display:none!important}

    #filmOverlay{position:fixed;inset:0;z-index:800;pointer-events:none;overflow:hidden}
    #filmOverlay::before{
      content:"";position:absolute;inset:-35%;opacity:.20;mix-blend-mode:screen;
      background-image:
        radial-gradient(circle at 12% 22%,#fff 0 .8px,transparent 1.5px),
        radial-gradient(circle at 72% 48%,#fff 0 1px,transparent 1.7px),
        radial-gradient(circle at 42% 78%,#fff 0 .7px,transparent 1.3px),
        radial-gradient(circle at 88% 16%,#fff 0 .6px,transparent 1.2px);
      background-size:41px 47px,67px 59px,53px 61px,83px 73px;
      animation:grain .16s steps(2) infinite
    }
    #filmOverlay::after{
      content:"";position:absolute;inset:0;
      background:
        linear-gradient(90deg,transparent 0 13%,rgba(255,255,255,.09) 13.15%,transparent 13.35% 67%,rgba(255,255,255,.06) 67.15%,transparent 67.35%),
        linear-gradient(transparent 0 49.5%,rgba(255,255,255,.035) 50%,transparent 50.5%),
        radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.74) 100%);
      opacity:.62;animation:flicker 2.2s infinite
    }
    @keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(3%,-2%)}40%{transform:translate(-2%,3%)}60%{transform:translate(2%,1%)}80%{transform:translate(-3%,-1%)}100%{transform:translate(1%,2%)}}
    @keyframes flicker{0%,100%{opacity:.60}5%{opacity:.72}6%{opacity:.50}31%{opacity:.63}32%{opacity:.76}68%{opacity:.56}69%{opacity:.67}}

    .overlay{
      position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
      padding:18px;text-align:center;color:var(--paper);overflow:hidden;background:#090909
    }
    .overlay::before{
      content:"";position:absolute;inset:-18vmax;
      background:repeating-radial-gradient(circle at center,#0b0b0b 0 8.5vmin,#2d2d2d 8.7vmin 15.5vmin,#0b0b0b 15.7vmin 23vmin);
      opacity:.95;animation:ringPulse 7s ease-in-out infinite
    }
    .overlay::after{
      content:"";position:absolute;inset:0;
      background:radial-gradient(circle at center,transparent 0 34%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.88) 100%)
    }
    @keyframes ringPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

    .panel{
      position:relative;z-index:2;width:min(470px,96vw);padding:34px 25px 28px;
      border:3px solid var(--paper);background:rgba(7,7,7,.88);
      box-shadow:0 0 0 7px #111,0 0 0 9px var(--paper),0 18px 42px rgba(0,0,0,.72)
    }
    .panel::before,.panel::after{
      content:"";position:absolute;left:50%;width:74%;height:25px;transform:translateX(-50%);
      border-top:2px solid var(--paper);border-radius:50%
    }
    .panel::before{top:17px}
    .panel::after{bottom:14px;transform:translateX(-50%) rotate(180deg)}
    .eyebrow{margin:3px 0 11px;font:700 12px/1 Georgia,serif;letter-spacing:.25em;text-transform:uppercase;color:#d7d7d7}
    .brand-logo{display:block;width:min(315px,86%);height:auto;margin:0 auto 8px;filter:grayscale(1) brightness(10);opacity:.96}
    .show-title{
      margin:2px auto 8px;max-width:390px;font-size:clamp(31px,8.8vw,53px);line-height:.84;letter-spacing:.018em;text-transform:uppercase;color:var(--paper);
      -webkit-text-stroke:2px #000;text-shadow:0 3px 0 #777,0 6px 0 #111,4px 9px 0 rgba(0,0,0,.8);transform:rotate(-1deg)
    }
    .subtitle{margin:15px auto 24px;max-width:340px;color:#e1e1e1;font:italic 700 16px/1.42 Georgia,serif}
    .flourish{display:flex;align-items:center;gap:10px;margin:5px auto 16px;width:82%;color:var(--paper)}
    .flourish::before,.flourish::after{content:"";flex:1;height:16px;border-top:2px solid currentColor;border-radius:50%}
    .flourish span{font:700 17px/1 Georgia,serif}
    .button-stack{display:flex;flex-direction:column;gap:12px}
    button{
      width:100%;min-height:56px;border:3px solid var(--paper);border-radius:999px;padding:12px 20px;background:var(--paper);color:#080808;
      font:900 15px/1 "Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;letter-spacing:.08em;cursor:pointer;
      box-shadow:0 5px 0 #5e5e5e,0 8px 0 #111;transition:transform .12s ease,box-shadow .12s ease
    }
    button:active{transform:translateY(5px) scale(.98,.94);box-shadow:0 1px 0 #5e5e5e,0 3px 0 #111}
    button.secondary{background:#111;color:var(--paper);box-shadow:0 5px 0 #555,0 8px 0 #000}
    button:disabled{opacity:.55;cursor:wait}
    #installHelp,#errorText{display:none;margin:15px 0 0;font:700 14px/1.45 Georgia,serif;color:#ddd}
    #errorText{color:#fff;text-decoration:underline}

    #scanFrame{position:fixed;z-index:700;left:50%;top:50%;transform:translate(-50%,-52%);width:min(73vw,390px);aspect-ratio:3/4;pointer-events:none}
    #scanFrame::before{
      content:"";position:absolute;inset:0;
      background:
        linear-gradient(#fff,#fff) left top/58px 3px no-repeat,
        linear-gradient(#fff,#fff) left top/3px 58px no-repeat,
        linear-gradient(#fff,#fff) right top/58px 3px no-repeat,
        linear-gradient(#fff,#fff) right top/3px 58px no-repeat,
        linear-gradient(#fff,#fff) left bottom/58px 3px no-repeat,
        linear-gradient(#fff,#fff) left bottom/3px 58px no-repeat,
        linear-gradient(#fff,#fff) right bottom/58px 3px no-repeat,
        linear-gradient(#fff,#fff) right bottom/3px 58px no-repeat;
      filter:drop-shadow(0 2px 2px #000);animation:frameBreathe 2.4s ease-in-out infinite
    }
    #scanFrame::after{content:"";position:absolute;inset:13px;border:1px solid rgba(255,255,255,.48);border-radius:48% 52% 49% 51%/3% 4% 3% 4%}
    .frame-label{position:absolute;left:50%;bottom:-46px;transform:translateX(-50%);white-space:nowrap;padding:8px 19px;border:2px solid #fff;border-radius:999px;background:rgba(0,0,0,.78);color:#fff;font:900 11px/1 "Arial Rounded MT Bold",Arial,sans-serif;letter-spacing:.11em;text-transform:uppercase;box-shadow:0 4px 10px rgba(0,0,0,.6)}
    @keyframes frameBreathe{0%,100%{opacity:.82;transform:scale(.995)}50%{opacity:1;transform:scale(1.005)}}

    #statusBar{
      position:fixed;z-index:900;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);
      width:min(92%,430px);padding:12px 18px;border:2px solid #fff;border-radius:999px;background:rgba(0,0,0,.82);color:#fff;
      text-align:center;font:900 14px/1 "Arial Rounded MT Bold",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;
      box-shadow:0 4px 14px rgba(0,0,0,.65);pointer-events:none
    }
    #statusBar::before,#statusBar::after{content:"✦";margin:0 8px;font-family:Georgia,serif}
    #statusBar.scan-pop{animation:scanPop .62s cubic-bezier(.18,.9,.25,1.35)}
    @keyframes scanPop{0%{transform:translateX(-50%) scale(.3,.75)}55%{transform:translateX(-50%) scale(1.12,.9)}100%{transform:translateX(-50%) scale(1)}}

    #shopBar{
      position:fixed;z-index:950;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);
      width:min(92%,430px);padding:11px 12px;display:flex;align-items:center;gap:10px;border:2px solid #fff;border-radius:18px;
      background:rgba(0,0,0,.84);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.68)
    }
    .shop-copy{min-width:0;flex:1;text-align:left;padding-left:5px}.shop-title{display:block;font:900 13px/1 "Arial Rounded MT Bold",Arial,sans-serif;text-transform:uppercase}.shop-subtitle{display:block;margin-top:4px;font:italic 700 11px/1.2 Georgia,serif;color:#d0d0d0}.shop-button{width:auto;min-height:42px;flex:0 0 auto;padding:9px 14px;font-size:11px;box-shadow:0 3px 0 #555,0 5px 0 #000}


    #cameraFlipButton{
      position:fixed;z-index:980;right:14px;top:max(76px,calc(env(safe-area-inset-top) + 65px));
      width:52px;min-height:52px;padding:0;border-radius:50%;font-size:23px;line-height:1;
      display:flex;align-items:center;justify-content:center;background:#f2f0e8;color:#050505;
      border:3px solid #050505;box-shadow:0 0 0 2px #fff,0 5px 0 #555,0 8px 14px rgba(0,0,0,.65)
    }
    #cameraFlipButton.selfie-active{background:#111;color:#fff;border-color:#fff}
    #photoButton{
      position:fixed;z-index:985;right:14px;bottom:max(88px,calc(env(safe-area-inset-bottom) + 78px));
      width:58px;min-height:58px;padding:0;border-radius:50%;font-size:25px;line-height:1;
      display:flex;align-items:center;justify-content:center;background:#f2f0e8;color:#050505;
      border:4px solid #050505;box-shadow:0 0 0 3px #fff,0 5px 0 #555,0 8px 14px rgba(0,0,0,.65)
    }
    #photoButton:active{transform:translateY(3px);box-shadow:0 0 0 3px #fff,0 2px 0 #555}
    #photoToast{position:fixed;z-index:1200;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);
      padding:13px 20px;border:3px solid #fff;border-radius:999px;background:rgba(0,0,0,.9);color:#fff;
      font:900 13px/1.1 "Arial Rounded MT Bold",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;
      opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease}
    #photoToast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
    #selfieMode{position:fixed;inset:0;z-index:450;background:#000;overflow:hidden}
    #selfieVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
    body.selfie-active #imageScene{visibility:hidden!important;pointer-events:none!important}
    body.selfie-active video:not(#selfieVideo){opacity:0!important;visibility:hidden!important}
    #shoulderCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:610;pointer-events:none}
    #selfieCallout{position:fixed;z-index:725;left:13px;right:13px;bottom:max(76px,calc(env(safe-area-inset-bottom) + 66px));
      max-width:390px;margin:auto;padding:10px 14px;border:2px solid #fff;border-radius:18px;background:rgba(0,0,0,.82);color:#fff;
      text-align:center;font:900 11px/1.35 "Arial Rounded MT Bold",Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase}
    #selfieCallout a{display:inline-block;margin-top:5px;color:#fff;font-size:14px;text-decoration:underline;text-underline-offset:3px;pointer-events:auto}

    @media (max-height:690px){.panel{padding:27px 20px 23px}.brand-logo{width:min(255px,78%)}.subtitle{margin:11px auto 17px}.button-stack{gap:9px}button{min-height:49px}.show-title{font-size:31px}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>
<div id="app">
  <div id="filmOverlay"></div>
  <div id="scanFrame" class="hidden"><span class="frame-label">Line up the full design</span></div>
  <div id="startOverlay" class="overlay"><div class="panel">
    <p class="eyebrow">A Lowxxy picture presentation</p>
    <img class="brand-logo" src="./icons/lowxxy-logo-white.png" alt="Lowxxy" />
    <h1 class="show-title">The Lowxxy Picture Show</h1><div class="flourish"><span>✦</span></div>
    <p class="subtitle">Present the design to the camera and let the picture begin.</p>
    <div class="button-stack"><button id="installButton" class="secondary">ADD TO HOME SCREEN</button><button id="startButton">START THE SHOW</button></div>
    <p id="installHelp"></p><p id="errorText"></p>
  </div></div>
  <div id="statusBar" class="hidden">Looking for a Lowxxy design...</div>
  <div id="shopBar" class="hidden"><div class="shop-copy"><span class="shop-title">More from Lowxxy</span><span class="shop-subtitle">See the latest designs.</span></div><button id="shopButton" class="shop-button">VISIT THE SHOP</button></div>


  <button id="cameraFlipButton" class="hidden" aria-label="Flip camera" title="Flip camera">↺</button>
  <button id="photoButton" class="hidden" aria-label="Take photo" title="Take photo">●</button>
  <div id="photoToast">PHOTO READY!</div>
  <div id="selfieMode" class="hidden">
    <video id="selfieVideo" autoplay muted playsinline></video>
    <canvas id="shoulderCanvas"></canvas>
    <div id="selfieCallout">LET'S TAKE A PHOTO — BE SURE TO TAG US<br><a href="https://www.instagram.com/lowxxy.brand/" target="_blank" rel="noopener">@lowxxy.brand</a></div>
  </div>

  <a-scene id="imageScene"
    mindar-image="imageTargetSrc: ./assets/targets.mind?v=122; maxTrack: 1; autoStart: false; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.00001; filterBeta: 0.0001; warmupTolerance: 15; missTolerance: 18;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true; antialias: true; logarithmicDepthBuffer: true;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false">
    <a-camera position="0 0 0" near="0.01" far="1000" look-controls="enabled:false"></a-camera>

    <a-assets timeout="90000">
      <a-asset-item id="chainmailAsset" src="./assets/chainmail.glb?v=122"></a-asset-item>
      <a-asset-item id="groundedGainsAsset" src="./assets/grounded-gains.glb?v=122"></a-asset-item>
      <a-asset-item id="hangAsset" src="./assets/hang-v77.glb?v=122"></a-asset-item>
      <a-asset-item id="popArtAsset" src="./assets/pop-art.glb?v=122"></a-asset-item>
    </a-assets>

    <!-- Target 0: Pop Art. Placed first in the scanner database so the dotted comic-book print gets priority over the similar regular Chainmail artwork. -->
    <a-entity id="target-pop-art" class="ar-target" data-name="POP ART" mindar-image-target="targetIndex: 0">
      <a-entity class="model-wrapper" visible="false" face-camera-upright="smoothing: 0.22" position="0 -0.08 0.07">
        <a-entity class="ar-model" gltf-model="#popArtAsset" animation-mixer="clip:*; loop:repeat; repetitions:Infinity; timeScale:1" position="0.18 -0.238 0" rotation="0 180 0" scale="3.4 3.4 3.4"></a-entity>
      </a-entity>
    </a-entity>

    <!-- Target 1: Grounded Gains. Enlarged aggressively and centered over its taller artwork. -->
    <a-entity id="target-grounded-gains" class="ar-target" data-name="GROUNDED GAINS" mindar-image-target="targetIndex: 1">
      <a-entity class="model-wrapper" visible="false" face-camera-upright="smoothing: 0.22" position="0 -0.12 0.08">
        <a-entity class="ar-model" gltf-model="#groundedGainsAsset" animation-mixer="clip:*; loop:repeat; repetitions:Infinity; timeScale:1" position="0 -0.28 0" rotation="0 180 0" scale="1.25 1.25 1.25"></a-entity>
      </a-entity>
    </a-entity>

    <!-- Target 2: Hang. Uses the same grouped Hang(7).glb with a major size reduction and centroid-based recentering. -->
    <a-entity id="target-hang" class="ar-target" data-name="HANG" mindar-image-target="targetIndex: 2">
      <a-entity class="model-wrapper" visible="false" face-camera-upright="smoothing: 0.22" position="0 -0.03 0.08">
        <a-entity class="ar-model" gltf-model="#hangAsset" animation-mixer="clip:*; loop:repeat; repetitions:Infinity; timeScale:1" position="0 -0.68 -0.013" rotation="0 180 0" scale="7 7 7"></a-entity>
      </a-entity>
    </a-entity>

    <!-- Target 3: Chainmail. Intentionally mapped to the Pop Art animation so both similar designs now trigger the Pop Art experience. -->
    <a-entity id="target-chainmail" class="ar-target" data-name="CHAINMAIL" mindar-image-target="targetIndex: 3">
      <a-entity class="model-wrapper" visible="false" face-camera-upright="smoothing: 0.22" position="0 -0.08 0.07">
        <a-entity class="ar-model" gltf-model="#popArtAsset" animation-mixer="clip:*; loop:repeat; repetitions:Infinity; timeScale:1" position="-0.193 -0.238 0" rotation="0 180 0" scale="3.4 3.4 3.4"></a-entity>
      </a-entity>
    </a-entity>

    <a-light type="ambient" intensity="2.2"></a-light>
    <a-light type="directional" intensity="2.2" position="1 2 3"></a-light>
  </a-scene>
</div>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const scene = document.querySelector('#imageScene');
  const cameraFlipButton = document.querySelector('#cameraFlipButton');
  const photoButton = document.querySelector('#photoButton');
  const photoToast = document.querySelector('#photoToast');
  const selfieMode = document.querySelector('#selfieMode');
  const selfieVideo = document.querySelector('#selfieVideo');
  const shoulderCanvas = document.querySelector('#shoulderCanvas');
  const startOverlay = document.querySelector('#startOverlay');
  const startButton = document.querySelector('#startButton');
  const installButton = document.querySelector('#installButton');
  const installHelp = document.querySelector('#installHelp');
  const statusBar = document.querySelector('#statusBar');
  const scanFrame = document.querySelector('#scanFrame');
  const shopBar = document.querySelector('#shopBar');
  const shopButton = document.querySelector('#shopButton');
  const errorText = document.querySelector('#errorText');
  const targets = [...document.querySelectorAll('.ar-target')];
  let arSystem = null;
  let deferredInstallPrompt = null;
  let loadedModels = 0;
  let selfieStream = null;
  let selfieActive = false;
  let faceDetector = null;
  let faceLoopRunning = false;
  let faceSendBusy = false;
  let lastFaceTime = 0;
  let shoulderRenderer = null;
  let shoulderScene = null;
  let shoulderCamera = null;
  let shoulderGroup = null;
  let shoulderMixer = null;
  let shoulderClock = null;
  let shoulderBaseHeight = 1;
  let shoulderModelReady = false;
  const shoulderTarget = { x: 0, y: 0, scale: 1, visible: false };

  const resizeShoulderRenderer = () => {
    if (!shoulderRenderer || !shoulderCamera) return;
    const width = Math.max(1, window.innerWidth);
    const height = Math.max(1, window.innerHeight);
    const aspect = width / height;
    shoulderRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    shoulderRenderer.setSize(width, height, false);
    shoulderCamera.left = -aspect;
    shoulderCamera.right = aspect;
    shoulderCamera.top = 1;
    shoulderCamera.bottom = -1;
    shoulderCamera.updateProjectionMatrix();
  };

  const initShoulderRenderer = () => {
    if (shoulderRenderer) return;
    shoulderRenderer = new THREE.WebGLRenderer({ canvas: shoulderCanvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
    shoulderRenderer.setClearColor(0x000000, 0);
    shoulderRenderer.outputEncoding = THREE.sRGBEncoding;
    shoulderScene = new THREE.Scene();
    shoulderCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 100);
    shoulderCamera.position.set(0, 0, 10);
    shoulderCamera.lookAt(0, 0, 0);
    shoulderClock = new THREE.Clock();
    shoulderGroup = new THREE.Group();
    shoulderGroup.visible = false;
    shoulderScene.add(shoulderGroup);
    shoulderScene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 2.2));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(2, 4, 6);
    shoulderScene.add(key);
    resizeShoulderRenderer();
    window.addEventListener('resize', resizeShoulderRenderer);

    const loader = new THREE.GLTFLoader();
    loader.load('./assets/lowxxy-shoulder.glb?v=122', gltf => {
      const model = gltf.scene;
      model.traverse(node => {
        if (node.isMesh || node.isSkinnedMesh) {
          node.frustumCulled = false;
          const materials = Array.isArray(node.material) ? node.material : [node.material];
          materials.filter(Boolean).forEach(material => {
            material.side = THREE.DoubleSide;
            material.transparent = material.transparent || material.opacity < 1;
            material.needsUpdate = true;
          });
        }
      });
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      shoulderBaseHeight = Math.max(size.y, 0.001);
      model.position.set(-center.x, -box.min.y, -center.z);
      shoulderGroup.add(model);
      shoulderMixer = new THREE.AnimationMixer(model);
      (gltf.animations || []).forEach(clip => shoulderMixer.clipAction(clip).reset().play());
      shoulderModelReady = true;
      // Show a visible fallback immediately while face detection locks on.
      const aspect = window.innerWidth / Math.max(window.innerHeight, 1);
      shoulderTarget.x = -0.58 * aspect;
      shoulderTarget.y = -0.28;
      shoulderTarget.scale = 0.62 / shoulderBaseHeight;
      shoulderTarget.visible = true;
    }, undefined, error => {
      console.error('Shoulder model failed to load', error);
    });

    const renderShoulder = () => {
      requestAnimationFrame(renderShoulder);
      const dt = Math.min(0.05, shoulderClock.getDelta());
      if (shoulderMixer && selfieActive) shoulderMixer.update(dt);
      if (shoulderGroup) {
        shoulderGroup.visible = selfieActive && shoulderModelReady && shoulderTarget.visible;
        if (shoulderGroup.visible) {
          shoulderGroup.position.x += (shoulderTarget.x - shoulderGroup.position.x) * 0.22;
          shoulderGroup.position.y += (shoulderTarget.y - shoulderGroup.position.y) * 0.22;
          const s = shoulderGroup.scale.x + (shoulderTarget.scale - shoulderGroup.scale.x) * 0.18;
          shoulderGroup.scale.setScalar(s);
        }
      }
      shoulderRenderer.render(shoulderScene, shoulderCamera);
    };
    renderShoulder();
  };

  const handleFaceResults = results => {
    const detection = results?.detections?.[0];
    if (!detection || !shoulderCamera) {
      // Keep the model visible at a sensible shoulder fallback until a face locks.
      if (selfieActive && shoulderModelReady) {
        const aspect = window.innerWidth / Math.max(window.innerHeight, 1);
        shoulderTarget.x = -0.58 * aspect;
        shoulderTarget.y = -0.28;
        shoulderTarget.scale = 0.62 / shoulderBaseHeight;
        shoulderTarget.visible = true;
      }
      return;
    }
    const box = detection.boundingBox;
    if (!box) return;
    lastFaceTime = performance.now();
    shoulderTarget.visible = true;
    const aspect = window.innerWidth / Math.max(window.innerHeight, 1);
    const faceX = box.xCenter;
    const faceTop = box.yCenter - box.height / 2;
    // In mirrored selfie view, the person's right shoulder is screen-left.
    // The uploaded character leans screen-right, toward the person's head.
    const shoulderX = faceX - box.width * 0.82;
    const shoulderY = faceTop + box.height * 1.12;
    shoulderTarget.x = (shoulderX - 0.5) * 2 * aspect;
    shoulderTarget.y = (0.5 - shoulderY) * 2;
    const desiredHeightWorld = Math.max(0.58, box.height * 2.7);
    shoulderTarget.scale = desiredHeightWorld / shoulderBaseHeight;
  };

  const initFaceDetector = async () => {
    if (faceDetector) return;
    faceDetector = new FaceDetection({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
    });
    faceDetector.setOptions({ selfieMode: true, model: 'short', minDetectionConfidence: 0.5 });
    faceDetector.onResults(handleFaceResults);
  };

  const runFaceLoop = async () => {
    if (faceLoopRunning) return;
    faceLoopRunning = true;
    const step = async () => {
      if (!selfieActive) {
        faceLoopRunning = false;
        shoulderTarget.visible = false;
        return;
      }
      if (!faceSendBusy && faceDetector && selfieVideo.readyState >= 2) {
        faceSendBusy = true;
        try { await faceDetector.send({ image: selfieVideo }); }
        catch (error) { console.warn('Face detection frame failed', error); }
        finally { faceSendBusy = false; }
      }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };

  const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isAndroid = /android/i.test(navigator.userAgent);
  if (isStandalone) installButton.classList.add('hidden');

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;
    installButton.classList.remove('hidden');
  });

  installButton.addEventListener('click', async () => {
    installHelp.style.display = 'block';
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      return;
    }
    installHelp.textContent = isIOS
      ? 'In Safari, tap Share, then Add to Home Screen, then Add.'
      : isAndroid
      ? 'Use Chrome’s three-dot menu and choose Install app or Add to Home screen.'
      : 'Use your browser’s install option.';
  });

  shopButton.addEventListener('click', () => { location.href = 'https://lowxxy.myshopify.com'; });
  scene.addEventListener('loaded', () => { arSystem = scene.systems['mindar-image-system']; });

  document.querySelectorAll('.ar-model').forEach(model => {
    model.addEventListener('model-loaded', () => {
      loadedModels += 1;

      // Animated skinned meshes can otherwise disappear when a moving limb
      // leaves the mesh's original static bounding box. Keep every model part
      // renderable for the full animation and show both sides of thin geometry.
      const modelObject = model.getObject3D('mesh');
      if (modelObject) {
        modelObject.traverse(node => {
          if (node.isMesh || node.isSkinnedMesh) {
            node.frustumCulled = false;
            const materials = Array.isArray(node.material) ? node.material : [node.material];
            materials.filter(Boolean).forEach(material => {
              material.side = THREE.DoubleSide;
              material.needsUpdate = true;
            });
          }
        });
      }

      const clips = modelObject?.animations || [];
      model._animationDuration = clips.length
        ? Math.max(...clips.map(clip => clip.duration || 0))
        : 5;

      console.log('Loaded AR model', loadedModels, 'of 4', 'duration:', model._animationDuration);
    });
    model.addEventListener('model-error', event => {
      console.error('Model error', event);
      errorText.style.display = 'block';
      errorText.textContent = 'One of the 3D animations could not load. Confirm all four GLB files are inside the assets folder.';
    });
  });

  const restartAnimation = model => {
    const mixer = model.components['animation-mixer'];
    if (mixer && mixer.mixer) {
      mixer.mixer.stopAllAction();
      mixer.mixer.setTime(0);
      model.removeAttribute('animation-mixer');
      requestAnimationFrame(() => model.setAttribute('animation-mixer', 'clip:*; loop:repeat; repetitions:Infinity; timeScale:1'));
    }
  };

  // Smooth-release behavior:
  // - models stay upright and camera-facing while anchored to the design
  // - brief tracking wobble is smoothed by MindAR's filter
  // - when the design leaves frame, the current loop finishes once
  // - the model then hides automatically so the next design can be scanned
  targets.forEach(target => {
    const wrapper = target.querySelector('.model-wrapper');
    const model = target.querySelector('.ar-model');
    const name = target.dataset.name;
    let finishTimer = null;
    let isActive = false;

    const releaseTarget = () => {
      if (finishTimer) clearTimeout(finishTimer);
      finishTimer = null;
      target._finishTimer = null;
      wrapper.setAttribute('visible', false);
      wrapper.removeAttribute('animation__popout');
      isActive = false;
      target._stickyActive = false;
      statusBar.textContent = 'Looking for another Lowxxy design...';
    };

    target.addEventListener('targetFound', () => {
      if (finishTimer) {
        clearTimeout(finishTimer);
        finishTimer = null;
        target._finishTimer = null;
      }

      targets.forEach(other => {
        if (other !== target) {
          if (other._finishTimer) clearTimeout(other._finishTimer);
          other._finishTimer = null;
          other._stickyActive = false;
          other.querySelector('.model-wrapper').setAttribute('visible', false);
        }
      });

      if (!isActive) {
        restartAnimation(model);
        wrapper.removeAttribute('animation__popout');
        wrapper.setAttribute('visible', true);
        wrapper.setAttribute('scale', '0.78 0.78 0.78');
        requestAnimationFrame(() => {
          wrapper.setAttribute('animation__popout', 'property: scale; from: 0.78 0.78 0.78; to: 1 1 1; dur: 650; easing: easeOutBack');
        });
      } else {
        wrapper.setAttribute('visible', true);
      }

      isActive = true;
      target._stickyActive = true;
      statusBar.textContent = 'LOWXXY DESIGN SCANNED!';
      statusBar.classList.remove('scan-pop');
      void statusBar.offsetWidth;
      statusBar.classList.add('scan-pop');
    });

    target.addEventListener('targetLost', () => {
      if (!isActive) return;
      if (finishTimer) clearTimeout(finishTimer);

      const durationSeconds = Math.max(0.8, model._animationDuration || 5);
      const mixerComponent = model.components['animation-mixer'];
      const mixerTime = mixerComponent?.mixer?.time || 0;
      let remainingSeconds = durationSeconds - (mixerTime % durationSeconds);

      // Avoid an almost-instant cutoff when tracking is lost right at the end.
      if (remainingSeconds < 0.65) remainingSeconds += durationSeconds;

      statusBar.textContent = 'THE CARTOON IS FINISHING...';
      finishTimer = setTimeout(releaseTarget, remainingSeconds * 1000);
      target._finishTimer = finishTimer;
    });
  });

  const drawVideoCover = (ctx, video, width, height, mirror = false) => {
    if (!video || video.readyState < 2 || !video.videoWidth || !video.videoHeight) return false;
    const sourceRatio = video.videoWidth / video.videoHeight;
    const targetRatio = width / height;
    let sx = 0, sy = 0, sw = video.videoWidth, sh = video.videoHeight;
    if (sourceRatio > targetRatio) {
      sw = video.videoHeight * targetRatio;
      sx = (video.videoWidth - sw) / 2;
    } else {
      sh = video.videoWidth / targetRatio;
      sy = (video.videoHeight - sh) / 2;
    }
    ctx.save();
    if (mirror) {
      ctx.translate(width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, width, height);
    ctx.restore();
    return true;
  };

  const showPhotoToast = message => {
    photoToast.textContent = message;
    photoToast.classList.add('show');
    setTimeout(() => photoToast.classList.remove('show'), 1500);
  };

  const takePhoto = async () => {
    photoButton.disabled = true;
    try {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.round(window.innerWidth * pixelRatio);
      const height = Math.round(window.innerHeight * pixelRatio);
      const output = document.createElement('canvas');
      output.width = width;
      output.height = height;
      const ctx = output.getContext('2d');
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);

      let video = selfieActive ? selfieVideo : null;
      if (!video) {
        video = [...document.querySelectorAll('video')].find(item => item !== selfieVideo && item.srcObject && item.readyState >= 2);
      }
      drawVideoCover(ctx, video, width, height, selfieActive);

      if (selfieActive) {
        if (shoulderCanvas && shoulderCanvas.width && shoulderCanvas.height) {
          ctx.drawImage(shoulderCanvas, 0, 0, width, height);
        }
      } else {
        const arCanvas = scene.canvas || scene.querySelector('canvas');
        if (arCanvas && arCanvas.width && arCanvas.height) {
          ctx.drawImage(arCanvas, 0, 0, width, height);
        }
      }

      // Small vintage footer so shared photos point back to the brand.
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,.66)';
      ctx.fillRect(0, height - Math.round(42 * pixelRatio), width, Math.round(42 * pixelRatio));
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `900 ${Math.round(15 * pixelRatio)}px Arial`;
      ctx.fillText('@LOWXXY.BRAND', width / 2, height - Math.round(21 * pixelRatio));
      ctx.restore();

      const blob = await new Promise(resolve => output.toBlob(resolve, 'image/png', 0.95));
      if (!blob) throw new Error('Could not create photo');
      const file = new File([blob], `lowxxy-${Date.now()}.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Lowxxy AR Photo', text: 'Tag @lowxxy.brand' });
        showPhotoToast('PHOTO READY!');
      } else {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = file.name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        showPhotoToast('PHOTO SAVED!');
      }
    } catch (error) {
      console.error(error);
      if (error?.name !== 'AbortError') showPhotoToast('PHOTO FAILED — TRY AGAIN');
    } finally {
      photoButton.disabled = false;
    }
  };

  photoButton.addEventListener('click', takePhoto);

  const stopSelfieStream = () => {
    if (selfieStream) selfieStream.getTracks().forEach(track => track.stop());
    selfieStream = null;
    selfieVideo.srcObject = null;
  };

  const enterSelfieMode = async () => {
    try {
      if (arSystem) await arSystem.stop();
      targets.forEach(target => target.querySelector('.model-wrapper').setAttribute('visible', false));
      scanFrame.classList.add('hidden');
      shopBar.classList.add('hidden');
      selfieMode.classList.remove('hidden');
      document.body.classList.add('selfie-active');
      initShoulderRenderer();
      await initFaceDetector();
      selfieStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      selfieVideo.srcObject = selfieStream;
      await selfieVideo.play();
      selfieActive = true;
      shoulderTarget.visible = false;
      runFaceLoop();
      cameraFlipButton.classList.add('selfie-active');
      cameraFlipButton.textContent = '↻';
      statusBar.classList.add('hidden');
    } catch (error) {
      console.error(error);
      stopSelfieStream();
      selfieMode.classList.add('hidden');
      document.body.classList.remove('selfie-active');
      shoulderTarget.visible = false;
      scanFrame.classList.remove('hidden');
      shopBar.classList.remove('hidden');
      statusBar.textContent = 'SELFIE CAMERA COULD NOT START';
      if (arSystem) await arSystem.start();
    }
  };

  const exitSelfieMode = async () => {
    stopSelfieStream();
    selfieMode.classList.add('hidden');
    document.body.classList.remove('selfie-active');
    shoulderTarget.visible = false;
    scanFrame.classList.remove('hidden');
    shopBar.classList.remove('hidden');
    selfieActive = false;
    cameraFlipButton.classList.remove('selfie-active');
    cameraFlipButton.textContent = '↺';
    statusBar.classList.remove('hidden');
    statusBar.textContent = 'LOOKING FOR A LOWXXY DESIGN...';
    if (arSystem) await arSystem.start();
  };

  cameraFlipButton.addEventListener('click', async () => {
    cameraFlipButton.disabled = true;
    if (selfieActive) await exitSelfieMode();
    else await enterSelfieMode();
    cameraFlipButton.disabled = false;
  });

  startButton.addEventListener('click', async () => {
    startButton.disabled = true;
    startButton.textContent = 'WARMING UP THE PROJECTOR...';
    errorText.style.display = 'none';
    if (!arSystem) arSystem = scene.systems['mindar-image-system'];
    if (!arSystem) {
      errorText.style.display = 'block';
      errorText.textContent = 'The AR engine did not load. Refresh and try again.';
      startButton.disabled = false;
      startButton.textContent = 'RUN IT BACK';
      return;
    }
    startOverlay.classList.add('hidden');
    statusBar.classList.remove('hidden');
    shopBar.classList.remove('hidden');
    scanFrame.classList.remove('hidden');
    cameraFlipButton.classList.remove('hidden');
    photoButton.classList.remove('hidden');
    try {
      await arSystem.start();
    } catch (error) {
      console.error(error);
      startOverlay.classList.remove('hidden');
      statusBar.classList.add('hidden');
      shopBar.classList.add('hidden');
      scanFrame.classList.add('hidden');
      cameraFlipButton.classList.add('hidden');
      photoButton.classList.add('hidden');
      errorText.style.display = 'block';
      errorText.textContent = 'Camera or scanner could not start. Allow camera access, confirm targets.mind was uploaded, then refresh.';
      startButton.disabled = false;
      startButton.textContent = 'RUN IT BACK';
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js?v=122'));
  }
});
</script>
</body>
</html>
