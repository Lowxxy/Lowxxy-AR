<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Lowxxy AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    a-scene{position:fixed;inset:0}
    #start{position:fixed;z-index:1000;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
    #start button{padding:16px 28px;border:0;border-radius:999px;font-weight:800;font-size:18px}
    #status{position:fixed;z-index:900;top:20px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:999px;background:rgba(0,0,0,.75);color:#fff}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <div id="start"><button id="startButton">START AR</button></div>
  <div id="status" class="hidden">Point camera at the Lowxxy design</div>

  <a-scene
    mindar-image="imageTargetSrc: https://lowxxy.github.io/Lowxxy-AR/assets/targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;"
    embedded
    renderer="colorManagement: true; alpha: true;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false">

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <a-entity id="shirtTarget" mindar-image-target="targetIndex:0">
      <a-entity
        id="lowxxyModel"
        gltf-model="url(https://lowxxy.github.io/Lowxxy-AR/assets/Lowxxy_Popout_Test.glb)"
        animation-mixer="clip:*; loop:repeat; repetitions:Infinity; timeScale:1"
        position="0 -0.20 0.10"
        rotation="0 0 0"
        scale="80 80 80"
        visible="true">
      </a-entity>

      <a-light type="ambient" intensity="2"></a-light>
      <a-light type="directional" intensity="2" position="1 2 3"></a-light>
    </a-entity>
  </a-scene>

<script>
window.addEventListener("DOMContentLoaded", () => {
  const scene = document.querySelector("a-scene");
  const target = document.querySelector("#shirtTarget");
  const model = document.querySelector("#lowxxyModel");
  const start = document.querySelector("#start");
  const startButton = document.querySelector("#startButton");
  const status = document.querySelector("#status");
  let arSystem;

  scene.addEventListener("loaded", () => {
    arSystem = scene.systems["mindar-image-system"];
  });

  model.addEventListener("model-loaded", () => {
    status.textContent = "3D MODEL LOADED";
  });

  model.addEventListener("model-error", (event) => {
    console.error(event);
    status.textContent = "3D MODEL LOAD ERROR";
  });

  target.addEventListener("targetFound", () => {
    status.textContent = "LOWXXY UNLOCKED";
  });

  target.addEventListener("targetLost", () => {
    status.textContent = "Point camera back at the design";
  });

  startButton.addEventListener("click", async () => {
    startButton.disabled = true;
    startButton.textContent = "OPENING CAMERA...";
    if (!arSystem) arSystem = scene.systems["mindar-image-system"];
    try {
      await arSystem.start();
      start.classList.add("hidden");
      status.classList.remove("hidden");
    } catch (error) {
      console.error(error);
      startButton.disabled = false;
      startButton.textContent = "TRY AGAIN";
    }
  });

  // Remove old cached app files. This diagnostic page intentionally does not
  // register the service worker.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      const registrations = await navigator.serviceWorker.getRegistrations();
      for (const registration of registrations) await registration.unregister();
      if (window.caches) {
        const keys = await caches.keys();
        await Promise.all(keys.map(key => caches.delete(key)));
      }
    });
  }
});
</script>
</body>
</html>
