  <script>
    AFRAME.registerComponent('face-camera-upright', {
      schema: { smoothing: { default: 0.22 } },
      init() {
        this.worldPosition = new THREE.Vector3();
        this.cameraPosition = new THREE.Vector3();
        this.up = new THREE.Vector3(0, 1, 0);
        this.lookMatrix = new THREE.Matrix4();
        this.worldQuaternion = new THREE.Quaternion();
        this.parentQuaternion = new THREE.Quaternion();
        this.localQuaternion = new THREE.Quaternion();
      },
      tick() {
        const object = this.el.object3D;
        const camera = this.el.sceneEl.camera;
        if (!camera || !object.visible) return;
        object.getWorldPosition(this.worldPosition);
        camera.getWorldPosition(this.cameraPosition);
        this.cameraPosition.y = this.worldPosition.y;
        if (this.cameraPosition.distanceToSquared(this.worldPosition) < 0.000001) return;
        this.lookMatrix.lookAt(this.worldPosition, this.cameraPosition, this.up);
        this.worldQuaternion.setFromRotationMatrix(this.lookMatrix);
        if (object.parent) {
          object.parent.getWorldQuaternion(this.parentQuaternion).invert();
          this.localQuaternion.copy(this.parentQuaternion).multiply(this.worldQuaternion);
        } else {
          this.localQuaternion.copy(this.worldQuaternion);
        }
        object.quaternion.slerp(this.localQuaternion, this.data.smoothing);
      }
    });
  </script>

    /* NEW v249: v247 design preserved + stronger phone parity */
    .projector-window,.projector-window *{color-scheme:only light!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;forced-color-adjust:none!important}
    .projector-window{position:relative;isolation:isolate;width:100%;height:260px;margin:0 auto 4px;padding:0;background:transparent!important;border:0!important;box-shadow:none!important;overflow:visible!important;display:flex;justify-content:center}
    .projector-window::before,.projector-window::after{display:none!important}

    /* The whole TV scene is a fixed 410px composition.
       Phones scale this ENTIRE scene as one unit instead of restyling pieces. */
    .tv-stage{position:relative;width:410px;height:246px;flex:0 0 410px;transform-origin:50% 0;overflow:visible}

    .retro-tv{position:absolute;z-index:3;left:50%;top:63px;width:270px;height:177px;transform:translateX(-50%);border:3px solid #0d0d0d;border-radius:15px 15px 11px 11px;background:linear-gradient(145deg,#8b8b8b 0%,#555 20%,#2d2d2d 56%,#707070 100%)!important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.13),inset 0 -8px 18px rgba(0,0,0,.28),0 7px 0 #151515,0 14px 22px rgba(0,0,0,.50);transform-origin:50% 88%;animation:tvDance246 2.35s ease-in-out infinite}
    .retro-tv::before{content:"";position:absolute;inset:7px;border:2px solid rgba(255,255,255,.20);border-radius:10px;pointer-events:none}

    .tv-screen{position:absolute;left:12px;top:17px;width:194px;height:118px;border:4px solid #101010;border-radius:20px 20px 18px 18px;overflow:hidden;background:#d9d9d3!important;box-shadow:inset 0 0 20px rgba(0,0,0,.42),0 0 0 2px #929292;animation:screenFlicker246 .17s steps(2,end) infinite}

    /* Desktop */
    @media(min-width:431px){
      .projector-window{height:260px}
      .tv-stage{transform:scale(1)}
    }

    /* Phone: same exact 410px composition, just scale the whole thing.
       This prevents the "different phone design" problem. */
    @media(max-width:430px){
      .panel{width:min(430px,94vw);padding:22px 14px 20px}
      .eyebrow{font-size:10px;margin-bottom:4px}
      .projector-window{height:242px}
      .tv-stage{transform:scale(.90)}
      .show-title-art{width:min(398px,96%);margin-top:-4px;margin-bottom:7px}
      .subtitle{font-size:14px;margin:8px auto 13px}
      .flourish{margin:2px auto 9px}
      .button-stack{gap:9px}
      button{min-height:49px}
      #cameraTools{gap:12px;padding-left:13px;padding-right:13px}.tool-wrap{width:62px}.round-tool,#collectionButton{width:58px!important;height:58px!important;min-height:58px!important}.round-tool svg,#collectionButton svg{width:25px!important;height:25px!important}
      .film-sheet{height:42vh;min-height:260px;grid-template-rows:48px 1fr 48px}.film-frame{width:72vw;min-width:250px}.film-track{gap:16px}.film-holes::before{inset:8px 0;background:repeating-linear-gradient(90deg,transparent 0 13px,#e7dfc8 13px 34px,transparent 34px 55px)}
    }
    @media(max-width:380px){
      .projector-window{height:226px}
      .tv-stage{transform:scale(.83)}
      .show-title-art{width:97%}
    }
    @media(max-height:690px){
      .panel{padding:19px 14px 17px}
      .projector-window{height:213px}
      .tv-stage{transform:scale(.78)}
      .show-title-art{width:min(390px,94%);margin-top:-9px}
      .subtitle{margin:6px auto 9px;font-size:13px}
      .flourish{margin:1px auto 7px}
      button{min-height:46px}
    }

    /* v249 PHONE PARITY FIX — keep v247 desktop design, compensate only on phones */
    @media(max-width:430px){
      /* Preserve the same composition; only scale the whole scene. */
      .tv-stage{
        transform:scale(.90)!important;
        transform-origin:50% 0!important;
      }

      /* Shirts: keep the exact clean design but force true white on Samsung/mobile. */
      .tv-shirt{
        filter:brightness(2.15) contrast(.90) saturate(0)!important;
        opacity:1!important;
      }

      /* TV cabinet: feed mobile a lighter grayscale palette so the final
         Samsung rendering visually lands close to the desktop v247 tones. */
      .retro-tv{
        background:linear-gradient(
          145deg,
          #dddddd 0%,
          #a8a8a8 20%,
          #6f6f6f 56%,
          #bdbdbd 100%
        )!important;
        box-shadow:
          inset 0 0 0 2px rgba(255,255,255,.48),
          inset 0 -8px 18px rgba(0,0,0,.14),
          0 7px 0 #454545,
          0 14px 22px rgba(0,0,0,.40)!important;
      }
      .retro-tv::before{
        border-color:rgba(255,255,255,.60)!important;
      }
      .tv-side{
        background:linear-gradient(#ababab,#606060)!important;
        border-color:#262626!important;
      }
      .tv-knob{
        background:radial-gradient(
          circle at 33% 28%,
          #ffffff 0%,
          #eeeeee 24%,
          #a8a8a8 58%,
          #4b4b4b 100%
        )!important;
      }
      .tv-knob::after{
        background:#ffffff!important;
      }
      .tv-speaker{
        background:repeating-linear-gradient(
          0deg,
          #242424 0 2px,
          #a0a0a0 2px 4px
        )!important;
      }
      .tv-foot{
        background:#9a9a9a!important;
      }

      /* Screen: much brighter base + stronger visible analog static.
         The static itself stays animated from the v247 code. */
      .tv-screen{
        background:#ffffff!important;
        box-shadow:
          inset 0 0 13px rgba(0,0,0,.20),
          0 0 0 2px #eeeeee!important;
        filter:brightness(1.46) contrast(.88)!important;
      }
      .tv-static-layer{
        opacity:.58!important;
        mix-blend-mode:multiply!important;
        filter:contrast(1.46) brightness(1.42)!important;
      }
      .tv-screen::after{
        opacity:.42!important;
      }
      .screen-glow{
        opacity:.90!important;
        background:radial-gradient(
          ellipse at center,
          rgba(255,255,255,.36),
          transparent 72%
        )!important;
      }
      .screen-brand-logo{
        filter:brightness(1.95) contrast(.86)
          drop-shadow(0 0 5px rgba(255,255,255,.32))!important;
        opacity:1!important;
      }

      /* Antennas need the same lighter silver feel as desktop. */
      .tv-antenna{
        background:linear-gradient(#ffffff,#bdbdbd 20%,#484848)!important;
      }
      .tv-antenna::before{
        background:#f7f7f7!important;
      }
    }

    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
