<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Lowxxy AR - Hang</title>
  <link rel="manifest" href="./manifest.webmanifest?v=71" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
  <style>
    :root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    #app,a-scene{position:fixed;inset:0;width:100%;height:100%}
    .overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.08),transparent 40%),#000;text-align:center}
    .panel{width:min(460px,100%);padding:30px 24px;border:1px solid rgba(255,255,255,.18);border-radius:24px;background:rgba(10,10,10,.94);box-shadow:0 20px 60px rgba(0,0,0,.55)}
    h1{margin:0 0 12px;font-size:32px;letter-spacing:.06em}
    .subtitle{margin:0 0 22px;color:rgba(255,255,255,.75);font-size:16px;line-height:1.5}
    .button-stack{display:flex;flex-direction:column;gap:12px}
    button{width:100%;min-height:54px;border:0;border-radius:999px;padding:14px 22px;background:#fff;color:#000;font:inherit;font-weight:800;letter-spacing:.05em;cursor:pointer}
    button.secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.22)}
    button:disabled{opacity:.5;cursor:wait}
    #installHelp,#errorText{display:none;margin:16px 0 0;font-size:14px;line-height:1.45}
    #installHelp{color:rgba(255,255,255,.72)}
    #errorText{color:#ffb4b4}
    #statusBar{position:fixed;z-index:900;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);width:min(92%,430px);padding:11px 16px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(0,0,0,.72);color:#fff;text-align:center;font-size:14px;backdrop-filter:blur(12px);pointer-events:none}
    #shopBar{position:fixed;z-index:950;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92%,430px);padding:14px;display:flex;align-items:center;gap:12px;border-radius:24px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.82);color:#fff;box-shadow:0 12px 36px rgba(0,0,0,.38);backdrop-filter:blur(14px)}
    .shop-copy{min-width:0;flex:1;text-align:left}.shop-title{display:block;font-size:14px;font-weight:800}.shop-subtitle{display:block;margin-top:3px;color:rgba(255,255,255,.68);font-size:12px}.shop-button{width:auto;min-height:42px;flex:0 0 auto;padding:10px 16px;font-size:12px}.hidden{display:none!important}
  </style>
</head>
<body>
<div id="app">
  <div id="startOverlay" class="overlay"><div class="panel">
    <h1>LOWXXY AR</h1>
    <p class="subtitle">Fresh Hang-only build. Scan the Hang design to unlock its 3D animation.</p>
    <div class="button-stack"><button id="installButton" class="secondary">INSTALL LOWXXY APP</button><button id="startButton">START AR</button></div>
    <p id="installHelp"></p><p id="errorText"></p>
  </div></div>
  <div id="statusBar" class="hidden">Point the camera at the full Hang design</div>
  <div id="shopBar" class="hidden"><div class="shop-copy"><span class="shop-title">Want to see more?</span><span class="shop-subtitle">Explore the latest Lowxxy designs.</span></div><button id="shopButton" class="shop-button">SHOP LOWXXY</button></div>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets-v71.mind?v=71; maxTrack: 1; autoStart: false; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 8; missTolerance: 10;"
    embedded color-space="sRGB"
    renderer="colorManagement: true; alpha: true; antialias: true; logarithmicDepthBuffer: true;"
    vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">

    <a-camera position="0 0 0" near="0.01" far="1000" look-controls="enabled:false"></a-camera>

    <a-assets timeout="90000">
      <a-asset-item id="hangAsset" src="./assets/hang-v71.glb?v=71"></a-asset-item>
    </a-assets>

    <a-entity id="target-hang" class="ar-target" data-name="HANG" mindar-image-target="targetIndex: 0">
      <a-entity class="model-wrapper" visible="false" position="0 -0.05 0.08">
        <a-entity class="ar-model" gltf-model="#hangAsset" animation-mixer="clip:*; loop:repeat; repetitions:Infinity; timeScale:1" position="0.000001 0.00615 -0.001433" rotation="0 28 0" scale="6500000 6500000 6500000"></a-entity>
      </a-entity>
    </a-entity>

    <a-light type="ambient" intensity="2.2"></a-light>
    <a-light type="directional" intensity="2.2" position="1 2 3"></a-light>
  </a-scene>
</div>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const scene = document.querySelector('a-scene');
  const startOverlay = document.querySelector('#startOverlay');
  const startButton = document.querySelector('#startButton');
  const installButton = document.querySelector('#installButton');
  const installHelp = document.querySelector('#installHelp');
  const statusBar = document.querySelector('#statusBar');
  const shopBar = document.querySelector('#shopBar');
  const shopButton = document.querySelector('#shopButton');
  const errorText = document.querySelector('#errorText');
  const target = document.querySelector('#target-hang');
  let arSystem = null;
  let deferredInstallPrompt = null;
  const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isAndroid = /android/i.test(navigator.userAgent);
  if (isStandalone) installButton.classList.add('hidden');

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;
    installButton.classList.remove('hidden');
  });

  installButton.addEventListener('click', async () => {
    installHelp.style.display = 'block';
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      return;
    }
    installHelp.textContent = isIOS ? 'In Safari, tap Share, then Add to Home Screen, then Add.' : isAndroid ? 'Use Chrome’s three-dot menu and choose Install app or Add to Home screen.' : 'Use your browser’s install option.';
  });

  shopButton.addEventListener('click', () => { location.href = 'https://lowxxy.myshopify.com'; });
  scene.addEventListener('loaded', () => { arSystem = scene.systems['mindar-image-system']; });

  const model = document.querySelector('.ar-model');
  model.addEventListener('model-loaded', () => {
    const modelObject = model.getObject3D('mesh');
    if (modelObject) {
      modelObject.traverse(node => {
        if (node.isMesh || node.isSkinnedMesh) {
          node.frustumCulled = false;
          const materials = Array.isArray(node.material) ? node.material : [node.material];
          materials.filter(Boolean).forEach(material => {
            material.side = THREE.DoubleSide;
            material.needsUpdate = true;
          });
        }
      });
    }
    console.log('Hang AR model loaded');
  });
  model.addEventListener('model-error', event => {
    console.error('Model error', event);
    errorText.style.display = 'block';
    errorText.textContent = 'The Hang 3D animation could not load. Confirm hang-v71.glb is inside the assets folder.';
  });

  const wrapper = target.querySelector('.model-wrapper');
  const restartAnimation = () => {
    const mixer = model.components['animation-mixer'];
    if (mixer && mixer.mixer) {
      mixer.mixer.stopAllAction();
      mixer.mixer.setTime(0);
      model.removeAttribute('animation-mixer');
      requestAnimationFrame(() => model.setAttribute('animation-mixer', 'clip:*; loop:repeat; repetitions:Infinity; timeScale:1'));
    }
  };

  target.addEventListener('targetFound', () => {
    restartAnimation();
    wrapper.removeAttribute('animation__popout');
    wrapper.setAttribute('visible', true);
    wrapper.setAttribute('scale', '0.78 0.78 0.78');
    requestAnimationFrame(() => wrapper.setAttribute('animation__popout', 'property: scale; from: 0.78 0.78 0.78; to: 1 1 1; dur: 650; easing: easeOutBack'));
    statusBar.textContent = 'HANG UNLOCKED';
  });

  target.addEventListener('targetLost', () => {
    wrapper.setAttribute('visible', false);
    wrapper.removeAttribute('animation__popout');
    statusBar.textContent = 'Point the camera back at the full Hang design';
  });

  startButton.addEventListener('click', async () => {
    startButton.disabled = true;
    startButton.textContent = 'OPENING CAMERA...';
    errorText.style.display = 'none';
    if (!arSystem) arSystem = scene.systems['mindar-image-system'];
    if (!arSystem) {
      errorText.style.display = 'block';
      errorText.textContent = 'The AR engine did not load. Refresh and try again.';
      startButton.disabled = false;
      startButton.textContent = 'TRY AGAIN';
      return;
    }
    startOverlay.classList.add('hidden');
    statusBar.classList.remove('hidden');
    shopBar.classList.remove('hidden');
    try {
      await arSystem.start();
    } catch (error) {
      console.error(error);
      startOverlay.classList.remove('hidden');
      statusBar.classList.add('hidden');
      shopBar.classList.add('hidden');
      errorText.style.display = 'block';
      errorText.textContent = 'Camera or scanner could not start. Allow camera access, confirm targets-v71.mind was uploaded, then refresh.';
      startButton.disabled = false;
      startButton.textContent = 'TRY AGAIN';
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js?v=71'));
  }
});
</script>
</body>
</html>
