  <script>
    AFRAME.registerComponent('face-camera-upright', {
      schema: { smoothing: { default: 0.22 } },
      init() {
        this.worldPosition = new THREE.Vector3();
        this.cameraPosition = new THREE.Vector3();
        this.up = new THREE.Vector3(0, 1, 0);
        this.lookMatrix = new THREE.Matrix4();
        this.worldQuaternion = new THREE.Quaternion();
        this.parentQuaternion = new THREE.Quaternion();
        this.localQuaternion = new THREE.Quaternion();
      },
      tick() {
        const object = this.el.object3D;
        const camera = this.el.sceneEl.camera;
        if (!camera || !object.visible) return;
        object.getWorldPosition(this.worldPosition);
        camera.getWorldPosition(this.cameraPosition);
        this.cameraPosition.y = this.worldPosition.y;
        if (this.cameraPosition.distanceToSquared(this.worldPosition) < 0.000001) return;
        this.lookMatrix.lookAt(this.worldPosition, this.cameraPosition, this.up);
        this.worldQuaternion.setFromRotationMatrix(this.lookMatrix);
        if (object.parent) {
          object.parent.getWorldQuaternion(this.parentQuaternion).invert();
          this.localQuaternion.copy(this.parentQuaternion).multiply(this.worldQuaternion);
        } else {
          this.localQuaternion.copy(this.worldQuaternion);
        }
        object.quaternion.slerp(this.localQuaternion, this.data.smoothing);
      }
    });
  </script>

    /* NEW v261: v260 + projector-roll transitions */
    .projector-window,.projector-window *{color-scheme:only light!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;forced-color-adjust:none!important}
    .projector-window{position:relative;isolation:isolate;width:100%;height:260px;margin:0 auto 4px;padding:0;background:transparent!important;border:0!important;box-shadow:none!important;overflow:visible!important;display:flex;justify-content:center}
    .projector-window::before,.projector-window::after{display:none!important}

    /* The whole TV scene is a fixed 410px composition.
       Phones scale this ENTIRE scene as one unit instead of restyling pieces. */
    .tv-stage{position:relative;width:410px;height:246px;flex:0 0 410px;transform-origin:50% 0;overflow:visible}

    .retro-tv{position:absolute;z-index:3;left:50%;top:63px;width:270px;height:177px;transform:translateX(-50%);border:3px solid #0d0d0d;border-radius:15px 15px 11px 11px;background:linear-gradient(145deg,#8b8b8b 0%,#555 20%,#2d2d2d 56%,#707070 100%)!important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.13),inset 0 -8px 18px rgba(0,0,0,.28),0 7px 0 #151515,0 14px 22px rgba(0,0,0,.50);transform-origin:50% 88%;animation:tvDance246 2.35s ease-in-out infinite}
    .retro-tv::before{content:"";position:absolute;inset:7px;border:2px solid rgba(255,255,255,.20);border-radius:10px;pointer-events:none}

    .tv-screen{position:absolute;left:12px;top:17px;width:194px;height:118px;border:4px solid #101010;border-radius:20px 20px 18px 18px;overflow:hidden;background:#d9d9d3!important;box-shadow:inset 0 0 20px rgba(0,0,0,.42),0 0 0 2px #929292;animation:screenFlicker246 .17s steps(2,end) infinite}
