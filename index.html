<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lowxxy AR" />
  <title>Lowxxy AR</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #app, a-scene { position: fixed; inset: 0; width: 100%; height: 100%; }

    .overlay {
      position: fixed; inset: 0; z-index: 1000; display: flex;
      align-items: center; justify-content: center; padding: 24px;
      background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.09), transparent 38%), #000;
      text-align: center;
    }
    .panel {
      width: min(430px, 100%); padding: 30px 24px;
      border: 1px solid rgba(255,255,255,.22); border-radius: 24px;
      background: rgba(12,12,12,.94); box-shadow: 0 20px 60px rgba(0,0,0,.55);
    }
    .brand { margin: 0 0 8px; font-size: clamp(34px, 10vw, 54px); line-height: 1; letter-spacing: .12em; font-weight: 900; }
    .subtitle { margin: 0 0 20px; color: rgba(255,255,255,.72); font-size: 15px; line-height: 1.5; }
    .button-stack { display: grid; gap: 12px; }
    button {
      width: 100%; min-height: 54px; border: 0; border-radius: 999px;
      padding: 14px 22px; background: #fff; color: #000;
      font: inherit; font-weight: 800; letter-spacing: .05em; cursor: pointer;
    }
    button.secondary { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35); }
    button:disabled { opacity: .5; cursor: wait; }
    #installHelp { margin: 14px 0 0; color: rgba(255,255,255,.72); font-size: 13px; line-height: 1.45; display: none; }
    #statusBar {
      position: fixed; z-index: 900; left: 50%; top: max(18px, env(safe-area-inset-top));
      transform: translateX(-50%); width: min(92%, 430px); padding: 11px 16px;
      border: 1px solid rgba(255,255,255,.22); border-radius: 999px;
      background: rgba(0,0,0,.72); color: #fff; text-align: center; font-size: 14px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); pointer-events: none;
    }
    #errorText { display: none; margin: 18px 0 0; color: #ffb4b4; font-size: 14px; line-height: 1.45; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <div id="startOverlay" class="overlay">
      <div class="panel">
        <h1 class="brand">LOWXXY</h1>
        <p class="subtitle">Install Lowxxy AR or start scanning now.</p>
        <div class="button-stack">
          <button id="installButton" class="secondary hidden" type="button">INSTALL LOWXXY APP</button>
          <button id="startButton" type="button">START AR</button>
        </div>
        <p id="installHelp"></p>
        <p id="errorText"></p>
      </div>
    </div>

    <div id="statusBar" class="hidden">Point the camera at the Lowxxy design</div>

    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 8; missTolerance: 10;"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets timeout="20000">
        <video id="waveVideo" src="./assets/wave.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="shirtTarget" mindar-image-target="targetIndex: 0">
        <a-video id="videoPlane" src="#waveVideo" position="0 0 0.01" width="1" height="1"
          rotation="0 0 0" material="shader: flat; side: double;"></a-video>
      </a-entity>
    </a-scene>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector("a-scene");
      const targetEl = document.querySelector("#shirtTarget");
      const videoEl = document.querySelector("#waveVideo");
      const videoPlane = document.querySelector("#videoPlane");
      const startOverlay = document.querySelector("#startOverlay");
      const startButton = document.querySelector("#startButton");
      const installButton = document.querySelector("#installButton");
      const installHelp = document.querySelector("#installHelp");
      const statusBar = document.querySelector("#statusBar");
      const errorText = document.querySelector("#errorText");

      let arSystem;
      let deferredInstallPrompt = null;

      const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const isAndroid = /android/i.test(navigator.userAgent);

      const showError = (message) => {
        startOverlay.classList.remove("hidden");
        statusBar.classList.add("hidden");
        startButton.disabled = false;
        startButton.textContent = "TRY AGAIN";
        errorText.style.display = "block";
        errorText.textContent = message;
      };

      if (!isStandalone) {
        window.addEventListener("beforeinstallprompt", (event) => {
          event.preventDefault();
          deferredInstallPrompt = event;
          installButton.classList.remove("hidden");
          installHelp.style.display = "none";
        });

        if (isIOS) {
          installButton.classList.remove("hidden");
          installButton.textContent = "HOW TO INSTALL ON IPHONE";
        } else if (isAndroid) {
          installButton.classList.remove("hidden");
        }
      }

      window.addEventListener("appinstalled", () => {
        deferredInstallPrompt = null;
        installButton.classList.add("hidden");
        installHelp.style.display = "block";
        installHelp.textContent = "Lowxxy AR was installed successfully.";
      });

      installButton.addEventListener("click", async () => {
        installHelp.style.display = "block";

        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          const choice = await deferredInstallPrompt.userChoice;
          deferredInstallPrompt = null;
          if (choice.outcome === "accepted") {
            installHelp.textContent = "Installing Lowxxy AR…";
            installButton.classList.add("hidden");
          } else {
            installHelp.textContent = "Installation was canceled. You can try again later from Chrome's menu.";
          }
          return;
        }

        if (isIOS) {
          installHelp.textContent = "In Safari, tap Share, then Add to Home Screen, then Add.";
        } else if (isAndroid) {
          installHelp.textContent = "Open this page in Chrome, then tap this button again. If no prompt appears, tap Chrome's three-dot menu and choose Add to Home screen or Install app.";
        } else {
          installHelp.textContent = "Open this page in Chrome or Edge, then use the browser's install option.";
        }
      });

      videoEl.addEventListener("loadedmetadata", () => {
        if (videoEl.videoWidth && videoEl.videoHeight) {
          videoPlane.setAttribute("height", String(videoEl.videoHeight / videoEl.videoWidth));
        }
      });

      sceneEl.addEventListener("loaded", () => {
        arSystem = sceneEl.systems["mindar-image-system"];
      });

      sceneEl.addEventListener("arReady", () => {
        statusBar.textContent = "Point the camera at the Lowxxy design";
      });

      sceneEl.addEventListener("arError", () => {
        showError("The camera could not start. Use Safari on iPhone or Chrome on Android, then allow camera access.");
      });

      targetEl.addEventListener("targetFound", async () => {
        statusBar.textContent = "LOWXXY UNLOCKED";
        videoEl.currentTime = 0;
        try { await videoEl.play(); } catch (error) { console.warn("Video play blocked", error); }
      });

      targetEl.addEventListener("targetLost", () => {
        statusBar.textContent = "Point the camera back at the design";
        videoEl.pause();
        videoEl.currentTime = 0;
      });

      startButton.addEventListener("click", async () => {
        startButton.disabled = true;
        startButton.textContent = "OPENING CAMERA...";
        errorText.style.display = "none";

        if (!arSystem) arSystem = sceneEl.systems["mindar-image-system"];
        if (!arSystem) {
          showError("The AR engine did not load. Refresh the page and try again.");
          return;
        }

        try {
          videoEl.muted = true;
          await videoEl.play();
          videoEl.pause();
          videoEl.currentTime = 0;
        } catch (_) {}

        startOverlay.classList.add("hidden");
        statusBar.classList.remove("hidden");
        statusBar.textContent = "Opening camera...";

        try {
          await arSystem.start();
        } catch (error) {
          console.error(error);
          showError("The camera could not start. Check camera permission, then reload the page.");
        }
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js").catch((error) => {
            console.warn("Service worker registration failed:", error);
          });
        });
      }
    });
  </script>
</body>
</html>
