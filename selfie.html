<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Lowxxy Shoulder Photo</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:"Cooper Black","Arial Rounded MT Bold",Arial,sans-serif}
#video,#gl{position:fixed;inset:0;width:100%;height:100%}#video{object-fit:cover;transform:scaleX(-1);background:#000}#gl{pointer-events:none;z-index:2}
#grain{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55) 100%);mix-blend-mode:multiply}
#grain:after{content:"";position:absolute;inset:-30%;opacity:.13;background-image:radial-gradient(#fff 0 .7px,transparent 1px);background-size:11px 13px;animation:g .18s steps(2) infinite}@keyframes g{to{transform:translate(3%,-2%)}}
.control{position:fixed;z-index:20;width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:#111;color:#fff;font-size:27px;box-shadow:0 3px 0 #777;display:grid;place-items:center}
#back{top:max(14px,env(safe-area-inset-top));left:14px}#shoot{bottom:max(24px,calc(env(safe-area-inset-bottom) + 18px));left:50%;transform:translateX(-50%);width:76px;height:76px;font-size:35px}
#flip{top:max(14px,env(safe-area-inset-top));right:14px}
#msg{position:fixed;z-index:15;left:12px;right:12px;bottom:max(112px,calc(env(safe-area-inset-bottom) + 105px));padding:11px 14px;text-align:center;color:#fff;background:rgba(0,0,0,.72);border:2px solid #fff;border-radius:18px;font-size:14px;letter-spacing:.04em;text-shadow:1px 1px #000}
#msg a{color:#fff;text-decoration:underline}.hidden{display:none!important}#status{position:fixed;z-index:15;top:max(84px,calc(env(safe-area-inset-top) + 74px));left:50%;transform:translateX(-50%);padding:7px 13px;border-radius:20px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;white-space:nowrap;border:1px solid #fff}
#toast{position:fixed;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);padding:15px 20px;background:#050505;color:#fff;border:3px solid #fff;border-radius:18px;opacity:0;transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video><canvas id="gl"></canvas><div id="grain"></div>
<button id="back" class="control" aria-label="Back to scanner">←</button><button id="flip" class="control" aria-label="Flip shoulder side">↔</button><button id="shoot" class="control" aria-label="Take photo">●</button>
<div id="status">LOOKING FOR YOUR FACE...</div>
<div id="msg">LET'S TAKE A PHOTO — BE SURE TO TAG US<br><a href="https://www.instagram.com/lowxxy.brand/" target="_blank" rel="noopener">@lowxxy.brand</a></div><div id="toast">PHOTO READY!</div>
<script>
(async()=>{
const video=document.querySelector('#video'), canvas=document.querySelector('#gl'), status=document.querySelector('#status'), toast=document.querySelector('#toast');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setClearColor(0x000000,0);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.01,100);camera.position.z=5;
scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2.4));const dl=new THREE.DirectionalLight(0xffffff,2.0);dl.position.set(2,3,4);scene.add(dl);
let model=null,mixer=null,clock=new THREE.Clock(),face=null,side=-1,stream=null,detectBusy=false;
function resize(){const w=innerWidth,h=innerHeight,aspect=w/h;renderer.setSize(w,h,false);camera.left=-aspect;camera.right=aspect;camera.top=1;camera.bottom=-1;camera.updateProjectionMatrix();place();}addEventListener('resize',resize);
function place(){if(!model)return;const aspect=innerWidth/innerHeight;let x=side<0?-aspect*.48:aspect*.48,y=-.18,s=.48;if(face){const b=face;const fx=(b.xCenter-.5)*2*aspect;const fy=(.5-b.yCenter)*2;const shoulderOffset=Math.max(.34,b.width*aspect*.9);x=fx+(side<0?-shoulderOffset:shoulderOffset);y=fy-b.height*.70;s=Math.max(.38,Math.min(.72,b.height*1.55));}model.position.set(x,y,0);model.scale.setScalar(s);}
new THREE.GLTFLoader().load('./assets/lowxxy-shoulder.glb?v=124',g=>{model=g.scene;scene.add(model);const box=new THREE.Box3().setFromObject(model),size=new THREE.Vector3();box.getSize(size);const center=new THREE.Vector3();box.getCenter(center);model.position.sub(center);const norm=1/Math.max(size.y,.00001);model.scale.setScalar(norm);const holder=new THREE.Group();scene.remove(model);holder.add(model);model=holder;scene.add(model);if(g.animations&&g.animations.length){mixer=new THREE.AnimationMixer(g.scene);g.animations.forEach(c=>mixer.clipAction(c).play());}place();status.textContent='LOWXXY IS READY!';},undefined,e=>{console.error(e);status.textContent='LOWXXY MODEL COULD NOT LOAD';});
function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();if(mixer)mixer.update(dt);place();renderer.render(scene,camera);}animate();resize();
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;await video.play();}catch(e){status.textContent='FRONT CAMERA COULD NOT START';console.error(e);}
try{const fd=new FaceDetection({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${f}`});fd.setOptions({model:'short',minDetectionConfidence:.45,selfieMode:true});fd.onResults(r=>{const d=r.detections&&r.detections[0];if(d&&d.locationData&&d.locationData.relativeBoundingBox){face=d.locationData.relativeBoundingBox;status.textContent='FACE FOUND — LOWXXY IS ON YOUR SHOULDER';}else{face=null;status.textContent='LOOKING FOR YOUR FACE...';}});async function loop(){if(video.readyState>=2&&!detectBusy){detectBusy=true;try{await fd.send({image:video})}catch(e){console.warn(e)}detectBusy=false}setTimeout(loop,100)}loop();}catch(e){console.warn('Face detector unavailable; using fixed shoulder placement.',e);status.textContent='LOWXXY IS READY!';}
document.querySelector('#flip').onclick=()=>{side*=-1;place()};document.querySelector('#back').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());location.href='./index.html?v=124'};
function drawCover(ctx,source,w,h,mirror){const sw=source.videoWidth||source.width,sh=source.videoHeight||source.height;if(!sw||!sh)return;const scale=Math.max(w/sw,h/sh),dw=sw*scale,dh=sh*scale,dx=(w-dw)/2,dy=(h-dh)/2;ctx.save();if(mirror){ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(source,w-dx-dw,dy,dw,dh)}else ctx.drawImage(source,dx,dy,dw,dh);ctx.restore()}
document.querySelector('#shoot').onclick=async()=>{if(video.readyState<2)return;renderer.render(scene,camera);const w=video.videoWidth||1280,h=video.videoHeight||720;const out=document.createElement('canvas');out.width=w;out.height=h;const c=out.getContext('2d');drawCover(c,video,w,h,true);c.drawImage(canvas,0,0,w,h);c.fillStyle='rgba(0,0,0,.72)';c.fillRect(0,h-70,w,70);c.fillStyle='#fff';c.textAlign='center';c.font=`bold ${Math.max(24,w*.03)}px Arial`;c.fillText('@LOWXXY.BRAND',w/2,h-24);const blob=await new Promise(r=>out.toBlob(r,'image/png',.95));if(!blob)return;const file=new File([blob],`lowxxy-${Date.now()}.png`,{type:'image/png'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'Lowxxy Shoulder Photo'});else{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),4000)}}catch(e){if(e.name!=='AbortError')console.error(e)}toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)};
})();
</script>
</body></html>
