<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Lowxxy Selfie Camera</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial Black,Arial,sans-serif}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#000}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.10;background-image:radial-gradient(#fff .6px,transparent .8px),radial-gradient(#000 .7px,transparent .9px);background-position:0 0,5px 5px;background-size:8px 8px;mix-blend-mode:overlay;animation:flicker .18s infinite alternate}@keyframes flicker{from{opacity:.07}to{opacity:.13}}
#title{position:fixed;left:18px;right:18px;top:max(16px,env(safe-area-inset-top));z-index:3;text-align:center;background:rgba(17,17,17,.92);color:#fff;border:4px solid #eee;border-radius:999px;padding:13px 68px;font-size:18px;letter-spacing:1.5px;box-shadow:0 0 0 3px #171717}
.control{position:fixed;z-index:5;border:4px solid #eee;background:#171717;color:#fff;border-radius:50%;box-shadow:0 0 0 3px #171717,0 6px 0 rgba(0,0,0,.45);font-weight:900;display:grid;place-items:center;padding:0}.control:active{transform:translateY(3px)}
#back{left:20px;top:max(26px,calc(env(safe-area-inset-top) + 10px));width:52px;height:52px;font-size:28px}
#shoot{left:50%;bottom:max(146px,calc(env(safe-area-inset-bottom) + 134px));transform:translateX(-50%);width:82px;height:82px;font-size:44px}#shoot:active{transform:translateX(-50%) translateY(3px)}
#message{position:fixed;z-index:4;left:18px;right:18px;bottom:max(20px,env(safe-area-inset-bottom));background:rgba(18,18,18,.9);color:#fff;border:4px solid #eee;border-radius:28px;padding:16px 18px;text-align:center;font-size:16px;line-height:1.35;box-shadow:0 0 0 3px #171717}
#message a{display:block;color:#fff;font-size:23px;margin-top:7px;text-underline-offset:4px}
#toast{position:fixed;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);opacity:0;background:#171717;color:#fff;border:4px solid #eee;border-radius:999px;padding:17px 24px;font-weight:900;transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<video id="camera" autoplay muted playsinline></video>
<div id="grain"></div>
<div id="title">LOWXXY SELFIE CAMERA</div>
<button id="back" class="control" aria-label="Back">←</button>
<button id="shoot" class="control" aria-label="Take photo">●</button>
<div id="message">TAKE A PHOTO IN YOUR LOWXXY SHIRT AND TAG US FOR A CHANCE TO BE FEATURED ON OUR INSTAGRAM.<a href="https://www.instagram.com/lowxxy.brand/" target="_blank" rel="noopener">@LOWXXY.BRAND</a></div>
<div id="toast">PHOTO READY!</div>
<script>
const video=document.querySelector('#camera');
const toast=document.querySelector('#toast');
const shoot=document.querySelector('#shoot');
const title=document.querySelector('#title');
let stream=null;
let cameraReady=false;

function showToast(message='PHOTO READY!'){
  toast.textContent=message;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1400);
}

async function startCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'user'},width:{ideal:1920},height:{ideal:1080}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    await new Promise(resolve=>{
      if(video.readyState>=2 && video.videoWidth) return resolve();
      const done=()=>{video.removeEventListener('loadeddata',done);resolve()};
      video.addEventListener('loadeddata',done,{once:true});
      setTimeout(resolve,2000);
    });
    cameraReady=Boolean(video.videoWidth && video.videoHeight);
    shoot.disabled=!cameraReady;
  }catch(error){
    console.error(error);
    title.textContent='CAMERA PERMISSION NEEDED';
    shoot.disabled=true;
  }
}

function waitForFreshVideoFrame(){
  return new Promise(resolve=>{
    let finished=false;
    const done=()=>{if(!finished){finished=true;resolve()}};
    if('requestVideoFrameCallback' in HTMLVideoElement.prototype){
      video.requestVideoFrameCallback(done);
      setTimeout(done,800);
    }else{
      requestAnimationFrame(()=>requestAnimationFrame(done));
      setTimeout(done,300);
    }
  });
}

function drawMirrored(ctx,source,w,h){
  ctx.save();
  ctx.translate(w,0);
  ctx.scale(-1,1);
  ctx.drawImage(source,0,0,w,h);
  ctx.restore();
}

async function getCameraFrame(){
  const track=stream?.getVideoTracks?.()[0];
  if(track && 'ImageCapture' in window){
    try{
      const bitmap=await new ImageCapture(track).grabFrame();
      if(bitmap && bitmap.width && bitmap.height) return bitmap;
    }catch(error){
      console.warn('ImageCapture fallback:',error);
    }
  }
  await waitForFreshVideoFrame();
  if(!video.videoWidth || !video.videoHeight) throw new Error('Camera frame is not ready');
  return video;
}

async function savePhoto(){
  if(!cameraReady || !stream){
    showToast('CAMERA IS STILL LOADING');
    return;
  }
  shoot.disabled=true;
  try{
    const frame=await getCameraFrame();
    const sourceWidth=frame.width||frame.videoWidth;
    const sourceHeight=frame.height||frame.videoHeight;
    if(!sourceWidth||!sourceHeight) throw new Error('Empty camera frame');

    const out=document.createElement('canvas');
    out.width=sourceWidth;
    out.height=sourceHeight;
    const ctx=out.getContext('2d',{alpha:false,willReadFrequently:false});
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,out.width,out.height);
    drawMirrored(ctx,frame,out.width,out.height);
    if(frame instanceof ImageBitmap) frame.close();

    const footer=Math.max(90,out.height*.10);
    ctx.fillStyle='rgba(0,0,0,.82)';
    ctx.fillRect(0,out.height-footer,out.width,footer);
    ctx.fillStyle='#fff';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.font=`900 ${Math.max(30,out.width*.04)}px Arial`;
    ctx.fillText('@LOWXXY.BRAND',out.width/2,out.height-footer/2);

    const blob=await new Promise((resolve,reject)=>out.toBlob(b=>b?resolve(b):reject(new Error('Photo encoding failed')),'image/jpeg',0.94));
    const file=new File([blob],`lowxxy-selfie-${Date.now()}.jpg`,{type:'image/jpeg'});
    showToast();
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Lowxxy Selfie'});
    }else{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=file.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),5000);
    }
  }catch(error){
    console.error(error);
    showToast('PHOTO FAILED — TRY AGAIN');
  }finally{
    shoot.disabled=false;
  }
}

document.querySelector('#back').onclick=()=>location.href='./index.html?v=204';
shoot.onclick=savePhoto;
shoot.disabled=true;
startCamera();
addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(track=>track.stop())});
</script>
</body></html>
