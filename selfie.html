<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Lowxxy Selfie Camera</title>
<style>
:root{--paper:#f2f0e8;--gold:#d6aa42}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#000}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.09;background-image:radial-gradient(#fff .6px,transparent .8px),radial-gradient(#000 .7px,transparent .9px);background-position:0 0,5px 5px;background-size:8px 8px;mix-blend-mode:overlay;animation:flicker .18s infinite alternate}@keyframes flicker{from{opacity:.06}to{opacity:.11}}
#topPlate{position:fixed;z-index:4;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);width:min(78%,370px);padding:10px 13px 11px;text-align:center;background:rgba(9,9,9,.88);color:var(--paper);border:2px solid #d6aa42;border-radius:18px;box-shadow:0 4px 0 #6f531d,0 8px 18px #0009,0 0 16px rgba(214,170,66,.12);backdrop-filter:blur(5px)}
#title{font:900 11px/1 Georgia,serif;letter-spacing:.15em;color:#ffe59a}#subtitle{margin:5px 0 7px;font:italic 700 9px/1.2 Georgia,serif;color:#ddd;letter-spacing:.02em}#topPlate a{display:inline-flex;align-items:center;gap:6px;color:#ffe59a;text-decoration:none;border:2px solid #d6aa42;border-radius:999px;padding:6px 11px;font:900 10px/1 Arial,sans-serif;background:#17120a;box-shadow:0 0 12px rgba(214,170,66,.12)}#topPlate a svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9}
.control{border:3px solid var(--paper);background:linear-gradient(#242424,#0b0b0b);color:var(--paper);box-shadow:0 4px 0 #444,0 7px 0 #000;font-weight:900;display:grid;place-items:center;padding:0}.control:active{transform:translateY(3px)}.control svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#back{position:fixed;z-index:7;left:14px;top:max(14px,calc(env(safe-area-inset-top) + 2px));width:46px;height:46px;border-radius:16px}
#bottomDock{position:fixed;z-index:7;left:50%;bottom:max(18px,calc(env(safe-area-inset-bottom) + 8px));transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;gap:18px;padding:10px 16px 11px;border:2px solid rgba(242,240,232,.72);border-radius:999px;background:rgba(7,7,7,.84);box-shadow:0 8px 26px #000b;backdrop-filter:blur(7px)}
.dockItem{width:68px;display:flex;flex-direction:column;align-items:center;gap:6px}.dockBtn{width:64px;height:64px;border-radius:20px}.dockLabel{font:900 8px/1 Arial,sans-serif;letter-spacing:.08em;color:#f2f0e8;white-space:nowrap}
#shoot{background:var(--paper);color:#090909;border-color:#090909;box-shadow:0 0 0 3px var(--paper),0 4px 0 #555,0 7px 0 #000}#shoot svg{width:29px;height:29px}
#switchAR{color:#fff;background:linear-gradient(#242424,#0b0b0b)}
70%,100%{opacity:1}}
#toast{position:fixed;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);opacity:0;background:#171717;color:#fff;border:4px solid #eee;border-radius:999px;padding:17px 24px;font-weight:900;transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media(max-width:390px){#bottomDock{gap:12px}.dockItem{width:62px}.dockBtn{width:58px;height:58px}.control svg{width:25px;height:25px}}
50%{transform:translateX(-1.6vw)}100%{transform:translateX(.9vw)}}


  /* v215 — full-screen directional film-strip wipe */
  .film-wipe{position:fixed;inset:0;z-index:999999;pointer-events:none;overflow:hidden;visibility:hidden;opacity:0;background:#050505}
  .film-wipe.active{visibility:visible;opacity:1}
  .film-sheet{position:absolute;top:-6vh;width:150vw;height:112vh;display:grid;grid-template-rows:9vh 1fr 9vh;background:#080808;box-shadow:0 0 90px #000;will-change:transform}
  .film-sheet.to-right{left:-155vw;animation:filmSheetRight .62s cubic-bezier(.12,.78,.18,1) forwards}
  .film-sheet.to-left{right:-155vw;animation:filmSheetLeft .62s cubic-bezier(.12,.78,.18,1) forwards}
  .film-holes{background-color:#090909;background-image:repeating-linear-gradient(90deg,transparent 0 18px,#eee9dc 18px 42px,transparent 42px 64px);border-top:4px solid #e9e4d8;border-bottom:4px solid #e9e4d8}
  .film-body{position:relative;overflow:hidden;background:#0a0a0a}
  .film-frames-grid{position:absolute;inset:2.5vh 0;display:grid;grid-template-columns:repeat(10,1fr);gap:1.4vw;padding:0 1.4vw}
  .film-frame{position:relative;border:4px solid #e9e4d8;border-radius:3px;background:linear-gradient(145deg,#181818,#050505 70%);box-shadow:inset 0 0 24px #000;overflow:hidden}
  .film-frame::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.11),transparent 20%),linear-gradient(100deg,transparent 0 46%,rgba(255,255,255,.08) 48%,transparent 51%);mix-blend-mode:screen}
  .film-body::before{content:"";position:absolute;inset:0;z-index:3;background:repeating-linear-gradient(90deg,transparent 0 11vw,rgba(245,241,226,.18) 11vw 11.15vw,transparent 11.15vw 15vw);animation:filmFrameRush .09s steps(2,end) infinite;mix-blend-mode:screen}
  .film-body::after{content:"";position:absolute;inset:0;z-index:4;background:radial-gradient(circle at 20% 35%,rgba(255,255,255,.08),transparent 16%),radial-gradient(circle at 73% 62%,rgba(255,255,255,.06),transparent 18%),linear-gradient(90deg,rgba(0,0,0,.9),transparent 8%,transparent 92%,rgba(0,0,0,.9));animation:filmFlicker .12s steps(2,end) infinite}
  @keyframes filmSheetRight{0%{transform:translateX(0) skewX(-5deg)}100%{transform:translateX(260vw) skewX(-5deg)}}
  @keyframes filmSheetLeft{0%{transform:translateX(0) skewX(5deg)}100%{transform:translateX(-260vw) skewX(5deg)}}
  @keyframes filmFrameRush{0%{transform:translateX(0)}50%{transform:translateX(-5vw)}100%{transform:translateX(3vw)}}
  @keyframes filmFlicker{0%,100%{opacity:.88}50%{opacity:.58}}

</style>
</head>
<body>
<video id="camera" autoplay muted playsinline></video>
<div id="grain"></div>

<div id="topPlate"><div id="title">✦ GET FEATURED ✦</div><div id="subtitle">Rock your Lowxxy shirt, take the shot, and tag the brand.</div><a href="https://www.instagram.com/lowxxy.brand/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg>@LOWXXY.BRAND</a></div>
<button id="back" class="control" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<div id="bottomDock">
  <div class="dockItem">
    <button id="shoot" class="control dockBtn" aria-label="Take photo"><svg viewBox="0 0 24 24"><path d="M7.5 7 9 4.8h6L16.5 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3.5Z"/><circle cx="12" cy="13" r="4"/></svg></button>
    <span class="dockLabel">PHOTO</span>
  </div>
  <div class="dockItem">
    <button id="switchAR" class="control dockBtn" aria-label="Return to AR scanner"><svg viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-13.7-3.7L4 6.5"/><path d="M4 3v3.5h3.5"/><path d="M4 16a8 8 0 0 0 13.7 3.7l2.3-2.2"/><path d="M20 21v-3.5h-3.5"/><rect x="7" y="8" width="10" height="8" rx="2"/><circle cx="12" cy="12" r="2.2"/></svg></button>
    <span class="dockLabel">AR MODE</span>
  </div>
</div>
<div id="toast">PHOTO READY!</div>
<script>
const video=document.querySelector('#camera');
const toast=document.querySelector('#toast');
const shoot=document.querySelector('#shoot');
const title=document.querySelector('#title');
let stream=null;
let cameraReady=false;

video.setAttribute('webkit-playsinline','');

function filmTransitionTo(url,direction='right'){ lowxxyFilmNavigate(url,direction); }
function showToast(message='PHOTO READY!'){
  toast.textContent=message;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1700);
}

async function startCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{exact:'user'},width:{ideal:1920},height:{ideal:1080}},
      audio:false
    }).catch(()=>navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}));
    video.srcObject=stream;
    await video.play();
    await new Promise(resolve=>{
      if(video.readyState>=2 && video.videoWidth>0) return resolve();
      const done=()=>resolve();
      video.addEventListener('loadedmetadata',done,{once:true});
      video.addEventListener('canplay',done,{once:true});
      setTimeout(done,2500);
    });
    cameraReady=video.videoWidth>0 && video.videoHeight>0;
    shoot.disabled=!cameraReady;
  }catch(error){
    console.error(error);
    title.textContent='CAMERA PERMISSION NEEDED';
    shoot.disabled=true;
  }
}

function canvasLooksBlack(canvas){
  const sample=document.createElement('canvas');
  sample.width=32; sample.height=32;
  const c=sample.getContext('2d',{willReadFrequently:true});
  c.drawImage(canvas,0,0,32,32);
  const data=c.getImageData(0,0,32,32).data;
  let total=0, varied=0;
  for(let i=0;i<data.length;i+=4){
    const lum=(data[i]+data[i+1]+data[i+2])/3;
    total+=lum;
    if(lum>8) varied++;
  }
  return total/(data.length/4)<5 || varied<12;
}

function drawMirroredCover(ctx,source,sw,sh,dw,dh){
  const scale=Math.max(dw/sw,dh/sh);
  const cropW=dw/scale, cropH=dh/scale;
  const sx=(sw-cropW)/2, sy=(sh-cropH)/2;
  ctx.save();
  ctx.translate(dw,0);
  ctx.scale(-1,1);
  ctx.drawImage(source,sx,sy,cropW,cropH,0,0,dw,dh);
  ctx.restore();
}

async function blobToDrawable(blob){
  if('createImageBitmap' in window){
    try{return await createImageBitmap(blob)}catch(e){console.warn('createImageBitmap failed',e)}
  }
  return await new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(blob);
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Could not decode camera photo'))};
    img.src=url;
  });
}

async function captureWithTakePhoto(){
  const track=stream?.getVideoTracks?.()[0];
  if(!track || !('ImageCapture' in window)) return null;
  const capture=new ImageCapture(track);
  if(typeof capture.takePhoto!=='function') return null;
  const blob=await capture.takePhoto();
  if(!blob || !blob.size) return null;
  return await blobToDrawable(blob);
}

async function captureFromVideo(){
  await new Promise(resolve=>{
    let done=false;
    const finish=()=>{if(!done){done=true;resolve()}};
    if(typeof video.requestVideoFrameCallback==='function') video.requestVideoFrameCallback(finish);
    else requestAnimationFrame(()=>requestAnimationFrame(finish));
    setTimeout(finish,1000);
  });
  if(!video.videoWidth || !video.videoHeight) throw new Error('Video frame unavailable');
  return video;
}

async function makePhotoCanvas(source){
  const sw=source.width||source.videoWidth;
  const sh=source.height||source.videoHeight;
  if(!sw||!sh) throw new Error('Empty camera frame');
  const portrait=sh>=sw;
  const out=document.createElement('canvas');
  out.width=portrait?Math.min(sw,1440):Math.min(sh*0.75,1080);
  out.height=Math.round(out.width*4/3);
  if(out.width<720){out.width=1080;out.height=1440}
  const ctx=out.getContext('2d',{alpha:false,willReadFrequently:true});
  ctx.fillStyle='#111';ctx.fillRect(0,0,out.width,out.height);
  drawMirroredCover(ctx,source,sw,sh,out.width,out.height);
  const footer=Math.max(120,out.height*.11);
  ctx.fillStyle='rgba(0,0,0,.84)';
  ctx.fillRect(0,out.height-footer,out.width,footer);
  ctx.fillStyle='#fff';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`900 ${Math.max(38,out.width*.05)}px Arial`;
  ctx.fillText('@LOWXXY.BRAND',out.width/2,out.height-footer/2);
  return out;
}

async function savePhoto(){
  if(!cameraReady||!stream){showToast('CAMERA IS STILL LOADING');return}
  shoot.disabled=true;
  showToast('CAPTURING…');
  let drawable=null;
  try{
    try{drawable=await captureWithTakePhoto()}catch(e){console.warn('takePhoto failed',e)}
    let canvas=null;
    if(drawable){
      canvas=await makePhotoCanvas(drawable);
      if(canvasLooksBlack(canvas)){console.warn('takePhoto was black');canvas=null}
      if(drawable instanceof ImageBitmap) drawable.close();
    }
    if(!canvas){
      drawable=await captureFromVideo();
      canvas=await makePhotoCanvas(drawable);
    }
    if(canvasLooksBlack(canvas)) throw new Error('Camera returned a black frame');

    const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Encoding failed')),'image/png'));
    const file=new File([blob],`lowxxy-selfie-${Date.now()}.png`,{type:'image/png'});
    showToast('PHOTO READY!');
    if(navigator.share && navigator.canShare?.({files:[file]})){
      await navigator.share({files:[file],title:'Lowxxy Selfie'});
    }else{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),10000);
    }
  }catch(error){
    console.error(error);
    showToast('CAMERA BLOCKED THE PHOTO — TRY CHROME');
  }finally{shoot.disabled=false}
}

document.querySelector('#back').onclick=()=>{ sessionStorage.setItem('lowxxy-resume-ar','1'); const returnUrl=sessionStorage.getItem('lowxxy-return-url'); if(returnUrl) lowxxyFilmNavigate(returnUrl,'left'); else lowxxyFilmNavigate('./index.html?v=215','left'); };
document.querySelector('#switchAR').onclick=()=>{ sessionStorage.setItem('lowxxy-resume-ar','1'); lowxxyFilmNavigate('./index.html?v=215','left'); };
shoot.onclick=savePhoto;
shoot.disabled=true;
startCamera();
addEventListener('pagehide',()=>stream?.getTracks().forEach(track=>track.stop()));
</script>


<script>
(function(){
  function ensureFilmWipe(){
    let wipe=document.getElementById('lowxxyFilmWipe');
    if(wipe) return wipe;
    wipe=document.createElement('div');
    wipe.id='lowxxyFilmWipe';
    wipe.className='film-wipe';
    const frames=Array.from({length:10},()=>'<div class="film-frame"></div>').join('');
    wipe.innerHTML='<div class="film-sheet"><div class="film-holes"></div><div class="film-body"><div class="film-frames-grid">'+frames+'</div></div><div class="film-holes"></div></div>';
    document.body.appendChild(wipe);
    return wipe;
  }
  window.lowxxyFilmNavigate=function(url,direction){
    const wipe=ensureFilmWipe();
    const sheet=wipe.querySelector('.film-sheet');
    sheet.className='film-sheet '+(direction==='left'?'to-left':'to-right');
    wipe.classList.remove('active');
    void wipe.offsetWidth;
    wipe.classList.add('active');
    setTimeout(()=>{location.href=url;},500);
  };
})();
</script>

</body></html>
